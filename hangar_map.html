<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {SMAAPass} from 'three/addons/postprocessing/SMAAPass.js';
import {GTAOPass} from 'three/addons/postprocessing/GTAOPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import * as BGU from 'three/addons/utils/BufferGeometryUtils.js';

const $ = s => document.querySelector(s);
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp = (a,b,t)=> a+(b-a)*t;
let SEED = 20260920;
const srnd = ()=>{ SEED = (SEED*1664525 + 1013904223) >>> 0; return SEED/4294967296; };
const sr = (a,b)=> a + srnd()*(b-a);
const si = (a,b)=> Math.floor(sr(a,b+1));
const spick = arr => arr[Math.floor(srnd()*arr.length)];

/* ============================================================================
   РЕНДЕРЕР
============================================================================ */
const renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance', stencil:false});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.04, 400);

/** Окружение для отражений: без него metalness-поверхности выходят чёрными. */
/** Купол неба. Без него сквозь проёмы кровли видно чёрный фон,
    и дыры читаются как пятна черноты вместо источников света. */
function buildSky(){
  const [c,x] = cv(64,256);
  const g = x.createLinearGradient(0,0,0,256);
  g.addColorStop(0.00, '#7d9fc4');   // зенит
  g.addColorStop(0.42, '#aec4dc');
  g.addColorStop(0.62, '#d3dae2');   // горизонт в дымке
  g.addColorStop(0.80, '#c6c0b4');
  g.addColorStop(1.00, '#9a9186');   // земля/пыль
  x.fillStyle=g; x.fillRect(0,0,64,256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.mapping = THREE.EquirectangularReflectionMapping;
  const dome = new THREE.Mesh(
    new THREE.SphereGeometry(180, 24, 16),
    new THREE.MeshBasicMaterial({map:t, side:THREE.BackSide, fog:false, toneMapped:true}));
  dome.name='sky';
  scene.add(dome);
  SKY = dome;
}
let SKY = null;
function buildEnvironment(){
  const [c,x] = cv(256,128);
  // верх — свет из кровли, середина — стены ангара, низ — бетонный пол
  const g = x.createLinearGradient(0,0,0,128);
  g.addColorStop(0.00, '#cfd8e2');
  g.addColorStop(0.34, '#a8a49b');
  g.addColorStop(0.52, '#7d786f');
  g.addColorStop(0.72, '#6b665e');
  g.addColorStop(1.00, '#514c45');
  x.fillStyle=g; x.fillRect(0,0,256,128);
  // яркие пятна — имитация световых проёмов и ленточных окон
  for(let i=0;i<9;i++){
    const px=Math.random()*256, py=Math.random()*26;
    const rg=x.createRadialGradient(px,py,1,px,py,26);
    rg.addColorStop(0,'rgba(255,250,238,.85)'); rg.addColorStop(1,'rgba(255,250,238,0)');
    x.fillStyle=rg; x.fillRect(px-26,py-26,52,52);
  }
  for(let i=0;i<14;i++){
    const px=Math.random()*256, py=38+Math.random()*10;
    x.fillStyle='rgba(226,234,242,.55)';
    x.fillRect(px, py, 16, 5);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const env = pmrem.fromEquirectangular(tex).texture;
  pmrem.dispose(); tex.dispose();
  scene.environment = env;
}

/* ============================================================================
   ПРОЦЕДУРНЫЕ ТЕКСТУРЫ: albedo + карта высот → normal + roughness
============================================================================ */
function cv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return [c, c.getContext('2d',{willReadFrequently:true})]; }

/** Рисует fn 9 раз со сдвигами — результат бесшовный по обеим осям. */
function wrapDraw(x, size, fn){
  for(let ox=-1; ox<=1; ox++) for(let oy=-1; oy<=1; oy++){
    x.save(); x.translate(ox*size, oy*size); fn(); x.restore();
  }
}
function grain(x, w, h, amt){
  const img = x.getImageData(0,0,w,h), d = img.data;
  for(let i=0;i<d.length;i+=4){
    const n = (Math.random()-0.5)*amt*255;
    d[i]=clamp(d[i]+n,0,255); d[i+1]=clamp(d[i+1]+n,0,255); d[i+2]=clamp(d[i+2]+n,0,255);
  }
  x.putImageData(img,0,0);
}
/** Карта высот → AO: усреднённая окклюзия по окрестности, углубления темнее. */
function heightToAO(hc, power=1.0){
  const sz = hc.width, hx = hc.getContext('2d');
  const src = hx.getImageData(0,0,sz,sz).data;
  const [ac, ax] = cv(sz,sz);
  const out = ax.createImageData(sz,sz), o = out.data;
  const H = (x,y)=> src[(((y+sz)%sz)*sz + ((x+sz)%sz))*4] / 255;
  const R = 4;
  for(let y=0;y<sz;y++) for(let x=0;x<sz;x++){
    const h = H(x,y);
    let higher = 0, n = 0;
    for(let dy=-R; dy<=R; dy+=2) for(let dx=-R; dx<=R; dx+=2){
      if(!dx && !dy) continue;
      higher += Math.max(0, H(x+dx,y+dy) - h); n++;
    }
    const occ = clamp(1 - (higher/n)*5.0*power, 0, 1);
    const v = Math.round(clamp(0.35 + occ*0.65, 0, 1)*255);
    const i = (y*sz+x)*4;
    o[i]=o[i+1]=o[i+2]=v; o[i+3]=255;
  }
  ax.putImageData(out,0,0);
  return ac;
}
/** Карта высот (градации серого canvas) → нормаль-карта. */
function heightToNormal(hc, strength=2.0){
  const s = hc.width, hx = hc.getContext('2d');
  const src = hx.getImageData(0,0,s,s).data;
  const [nc, nx] = cv(s,s);
  const out = nx.createImageData(s,s), o = out.data;
  const H = (x,y)=> src[(((y+s)%s)*s + ((x+s)%s))*4] / 255;
  for(let y=0;y<s;y++) for(let x=0;x<s;x++){
    const dx = (H(x+1,y) - H(x-1,y)) * strength;
    const dy = (H(x,y+1) - H(x,y-1)) * strength;
    let nxv = -dx, nyv = -dy, nzv = 1;
    const l = Math.hypot(nxv,nyv,nzv);
    const i = (y*s+x)*4;
    o[i]   = (nxv/l*0.5+0.5)*255;
    o[i+1] = (nyv/l*0.5+0.5)*255;
    o[i+2] = (nzv/l*0.5+0.5)*255;
    o[i+3] = 255;
  }
  nx.putImageData(out,0,0);
  return nc;
}
const MAXA = ()=> renderer.capabilities.getMaxAnisotropy();
function T(canvas, rx=1, ry=1, srgb=true){
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx,ry);
  t.anisotropy = MAXA();
  if(srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ---------- OSB: стружка, уложенная слоями ---------- */
function osbMaps(size=1024, tint=1){
  const [c,x] = cv(size,size);
  const [h,hx] = cv(size,size);
  const [rg,rx] = cv(size,size);
  // Текстура покрывает ~1.22 м (ширина листа) → 1 px ≈ 1.2 мм.
  // Реальная щепа ОСП: длина 50-150 мм, ширина 10-25 мм → 40-125 px x 8-20 px.
  x.fillStyle = `rgb(${212*tint|0},${183*tint|0},${133*tint|0})`; x.fillRect(0,0,size,size);
  hx.fillStyle = '#6a6a6a'; hx.fillRect(0,0,size,size);
  rx.fillStyle = '#b8b8b8'; rx.fillRect(0,0,size,size);

  const layers = [
    {n:1400, a:()=>sr(0,6.283),                    w:[44,120], hgt:[9,19],  op:[.55,.85], hz:[0.30,0.48]},
    {n:1100, a:()=>sr(0,6.283),                    w:[50,132], hgt:[10,21], op:[.5,.82],  hz:[0.46,0.64]},
    // верхний слой ориентирован вдоль листа, но с широким разбросом ±35°
    {n:1500, a:()=>sr(-0.62,0.62) + (srnd()<0.18 ? 1.57 : 0), w:[56,148], hgt:[10,23], op:[.55,.88], hz:[0.62,0.84]}
  ];
  for(const L of layers){
    for(let i=0;i<L.n;i++){
      const w = sr(L.w[0],L.w[1]), hh = sr(L.hgt[0],L.hgt[1]), a = L.a();
      const px = srnd()*size, py = srnd()*size;
      // Щепа берётся из разных частей ствола: светлая заболонь и тёмное ядро.
      const lum = sr(0.88, 1.08);
      const warm = sr(0.90, 1.04);
      const r = clamp(230*lum*tint, 0, 255)|0,
            g = clamp(198*lum*tint*warm, 0, 255)|0,
            b = clamp(144*lum*tint*warm*sr(0.95,1.04), 0, 255)|0;
      const op = sr(L.op[0], L.op[1]);
      const hv = Math.round(sr(L.hz[0], L.hz[1])*255);
      const rr = Math.min(hh*0.42, 5);
      const rv = si(140, 210);

      wrapDraw(x, size, ()=>{
        x.save(); x.translate(px,py); x.rotate(a);
        x.fillStyle = `rgba(${r},${g},${b},${op})`;
        x.beginPath(); x.roundRect(-w/2,-hh/2,w,hh, rr); x.fill();
        // продольные волокна древесины вдоль щепы
        x.strokeStyle = `rgba(${clamp(r*0.80,0,255)|0},${clamp(g*0.76,0,255)|0},${clamp(b*0.68,0,255)|0},.14)`;
        x.lineWidth = 0.7;
        const fib = 2 + Math.floor(hh/6);
        for(let k=1;k<fib;k++){
          const yy = -hh/2 + hh*k/fib;
          x.beginPath(); x.moveTo(-w/2+rr, yy); x.lineTo(w/2-rr, yy); x.stroke();
        }
        // тень по контуру: щепа лежит слоями, между ними видны зазоры
        x.strokeStyle = `rgba(${clamp(r*0.64,0,255)|0},${clamp(g*0.60,0,255)|0},${clamp(b*0.54,0,255)|0},.20)`;
        x.lineWidth = 0.8;
        x.beginPath(); x.roundRect(-w/2,-hh/2,w,hh, rr); x.stroke();
        x.restore();
      });
      wrapDraw(hx, size, ()=>{
        hx.save(); hx.translate(px,py); hx.rotate(a);
        hx.fillStyle = `rgba(${hv},${hv},${hv},${op})`;
        hx.beginPath(); hx.roundRect(-w/2,-hh/2,w,hh, rr); hx.fill();
        hx.strokeStyle = 'rgba(32,32,32,.55)'; hx.lineWidth = 1.3;
        hx.beginPath(); hx.roundRect(-w/2,-hh/2,w,hh, rr); hx.stroke();
        hx.restore();
      });
      wrapDraw(rx, size, ()=>{
        rx.save(); rx.translate(px,py); rx.rotate(a);
        rx.fillStyle = `rgba(${rv},${rv},${rv},${op*0.8})`;
        rx.beginPath(); rx.roundRect(-w/2,-hh/2,w,hh, rr); rx.fill();
        rx.strokeStyle = 'rgba(248,248,248,.55)'; rx.lineWidth = 1.4;
        rx.beginPath(); rx.roundRect(-w/2,-hh/2,w,hh, rr); rx.stroke();
        rx.restore();
      });
    }
  }
  // смоляные глянцевые пятна
  for(let i=0;i<110;i++){
    const px=srnd()*size, py=srnd()*size, r=sr(20,120), al=sr(.05,.17);
    wrapDraw(x, size, ()=>{
      const g = x.createRadialGradient(px,py,2,px,py,r);
      g.addColorStop(0,`rgba(146,116,72,${al*0.8})`); g.addColorStop(1,'rgba(146,116,72,0)');
      x.fillStyle=g; x.beginPath(); x.arc(px,py,r,0,7); x.fill();
    });
    wrapDraw(rx, size, ()=>{
      const g = rx.createRadialGradient(px,py,2,px,py,r);
      g.addColorStop(0,`rgba(84,84,84,${al*2.8})`); g.addColorStop(1,'rgba(84,84,84,0)');
      rx.fillStyle=g; rx.beginPath(); rx.arc(px,py,r,0,7); rx.fill();
    });
  }
  // светлая древесная пыль в углублениях
  for(let i=0;i<150;i++){
    const px=srnd()*size, py=srnd()*size, r=sr(10,58), v=si(186,214);
    wrapDraw(x, size, ()=>{
      const g = x.createRadialGradient(px,py,1,px,py,r);
      g.addColorStop(0,`rgba(${v+22},${v+8},${v-18},${sr(.06,.15)})`); g.addColorStop(1,'rgba(0,0,0,0)');
      x.fillStyle=g; x.beginPath(); x.arc(px,py,r,0,7); x.fill();
    });
  }
  grain(x,size,size,0.028);
  return {albedo:c, height:h, rough:rg};
}

/* ---------- Бетонный пол ---------- */
function concreteMaps(size=768){
  const [c,x] = cv(size,size);
  const [h,hx] = cv(size,size);
  const [rg,rx] = cv(size,size);
  // Промышленный бетон — нейтрально-серый с лёгкой тёплой примесью, не бежевый.
  x.fillStyle='#86837d'; x.fillRect(0,0,size,size);
  hx.fillStyle='#aaaaaa'; hx.fillRect(0,0,size,size);
  rx.fillStyle='#e0e0e0'; rx.fillRect(0,0,size,size);
  // облачные пятна затирки
  for(let i=0;i<340;i++){
    const v = si(98,164);
    const px=srnd()*size, py=srnd()*size, r=sr(10,70), al=sr(.04,.16);
    wrapDraw(x, size, ()=>{ x.fillStyle=`rgba(${v},${v-2},${v-7},${al})`;
      x.beginPath(); x.arc(px,py,r,0,7); x.fill(); });
  }
  // мелкие каверны и щебень в высоте
  for(let i=0;i<2400;i++){
    const px=srnd()*size, py=srnd()*size, r=sr(0.7,3.4);
    const dark = srnd()<0.5;
    const hv = dark ? si(120,150) : si(170,205);
    wrapDraw(hx, size, ()=>{ hx.fillStyle=`rgba(${hv},${hv},${hv},.6)`;
      hx.beginPath(); hx.arc(px,py,r,0,7); hx.fill(); });
    if(srnd()<0.35){
      const v = dark ? si(92,126) : si(146,176);
      wrapDraw(x, size, ()=>{ x.fillStyle=`rgba(${v},${v-1},${v-4},.4)`;
        x.beginPath(); x.arc(px,py,r,0,7); x.fill(); });
    }
  }
  // масляные и грязевые разводы: тёмные и глянцевые
  for(let i=0;i<26;i++){
    const px=srnd()*size, py=srnd()*size, r=sr(40,150), v=si(38,68), al=sr(.12,.30);
    wrapDraw(x, size, ()=>{
      const g=x.createRadialGradient(px,py,2,px,py,r);
      g.addColorStop(0,`rgba(${v},${v-1},${v+2},${al})`); g.addColorStop(1,'rgba(0,0,0,0)');
      x.fillStyle=g; x.beginPath(); x.arc(px,py,r,0,7); x.fill();
    });
    wrapDraw(rx, size, ()=>{
      const g=rx.createRadialGradient(px,py,2,px,py,r);
      g.addColorStop(0,`rgba(74,74,74,${al*2.2})`); g.addColorStop(1,'rgba(74,74,74,0)');
      rx.fillStyle=g; rx.beginPath(); rx.arc(px,py,r,0,7); rx.fill();
    });
  }
  // затёртые до глянца проезды и пятна цементного молока
  for(let i=0;i<18;i++){
    const px=srnd()*size, py=srnd()*size, r=sr(60,180);
    wrapDraw(rx, size, ()=>{
      const g=rx.createRadialGradient(px,py,2,px,py,r);
      g.addColorStop(0,`rgba(168,168,168,${sr(.15,.4)})`); g.addColorStop(1,'rgba(168,168,168,0)');
      rx.fillStyle=g; rx.beginPath(); rx.arc(px,py,r,0,7); rx.fill();
    });
    wrapDraw(x, size, ()=>{
      const v=si(150,178);
      const g=x.createRadialGradient(px,py,2,px,py,r);
      g.addColorStop(0,`rgba(${v},${v},${v-3},${sr(.04,.12)})`); g.addColorStop(1,'rgba(0,0,0,0)');
      x.fillStyle=g; x.beginPath(); x.arc(px,py,r,0,7); x.fill();
    });
  }
  // трещины: ветвление с затуханием
  function crack(ctx, px,py,ang,len,w,col){
    ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(px,py);
    let cx=px, cy=py, a=ang;
    for(let j=0;j<len;j++){
      a += sr(-0.32,0.32); cx += Math.cos(a)*sr(5,13); cy += Math.sin(a)*sr(5,13);
      ctx.lineTo(cx,cy);
    }
    ctx.stroke();
    return [cx,cy,a];
  }
  for(let i=0;i<5;i++){
    const px=srnd()*size, py=srnd()*size, a=sr(0,6.28), w=sr(0.6,1.3);
    wrapDraw(x, size, ()=>{
      const [ex,ey,ea] = crack(x,px,py,a,9,w,'rgba(58,55,52,.34)');
      if(srnd()<0.6) crack(x,ex,ey,ea+sr(0.5,1.2),5,w*0.6,'rgba(58,55,52,.24)');
    });
    wrapDraw(hx, size, ()=>{
      const [ex,ey,ea] = crack(hx,px,py,a,9,w*1.3,'rgba(44,44,44,.7)');
      if(srnd()<0.6) crack(hx,ex,ey,ea+sr(0.5,1.2),5,w*0.8,'rgba(44,44,44,.5)');
    });
  }
  // Швы плит НЕ рисуем в текстуре: при тайлинге они дают регулярную решётку.
  // Вместо этого швы кладутся отдельной геометрией по границам плит пола.
  grain(x,size,size,0.035);
  return {albedo:c, height:h, rough:rg};
}

/* ---------- Пиломатериал каркаса ---------- */
function lumberMaps(size=512){
  const [c,x] = cv(size,size);
  const [h,hx] = cv(size,size);
  const [rg,rx] = cv(size,size);
  // Сосновый брус: текстура кроется вдоль волокна, годовые слои идут полосами
  // разной плотности, между ними — тёмная поздняя древесина.
  x.fillStyle='#c9b48f'; x.fillRect(0,0,size,size);
  hx.fillStyle='#8c8c8c'; hx.fillRect(0,0,size,size);
  rx.fillStyle='#cacaca'; rx.fillRect(0,0,size,size);

  // годовые слои: пары «ранняя светлая / поздняя тёмная» древесина
  let y = 0;
  while(y < size){
    const early = sr(16, 44);         // светлая широкая зона
    const late  = sr(1.4, 3.4);       // тёмная узкая зона
    const wob   = sr(6, 16);          // изгиб слоя по длине
    const phase = sr(0, 6.28);
    const lumE  = sr(0.94, 1.06);
    const lumL  = sr(0.76, 0.88);
    for(let px=0; px<size; px++){
      const off = Math.sin(px/size*Math.PI*2 + phase)*wob*0.35
                + Math.sin(px/size*Math.PI*6 + phase*2)*wob*0.12;
      // ранняя древесина
      const ye = y + off;
      x.fillStyle = `rgba(${clamp(214*lumE,0,255)|0},${clamp(189*lumE,0,255)|0},${clamp(146*lumE,0,255)|0},.85)`;
      x.fillRect(px, ye, 1, early);
      hx.fillStyle = `rgba(${clamp(176*lumE,0,255)|0},${clamp(176*lumE,0,255)|0},${clamp(176*lumE,0,255)|0},.8)`;
      hx.fillRect(px, ye, 1, early);
      rx.fillStyle = `rgba(${clamp(206*lumE,0,255)|0},${clamp(206*lumE,0,255)|0},${clamp(206*lumE,0,255)|0},.6)`;
      rx.fillRect(px, ye, 1, early);
      // поздняя древесина: темнее, плотнее, чуть ниже по высоте
      const yl = ye + early;
      x.fillStyle = `rgba(${clamp(168*lumL*1.15,0,255)|0},${clamp(134*lumL*1.15,0,255)|0},${clamp(92*lumL*1.15,0,255)|0},.8)`;
      x.fillRect(px, yl, 1, late);
      hx.fillStyle = `rgba(${clamp(96*lumL,0,255)|0},${clamp(96*lumL,0,255)|0},${clamp(96*lumL,0,255)|0},.85)`;
      hx.fillRect(px, yl, 1, late);
      rx.fillStyle = 'rgba(146,146,146,.55)';
      rx.fillRect(px, yl, 1, late);
    }
    y += early + late;
  }
  // тонкие волокна поверх слоёв — придают дереву «ворс»
  for(let i=0;i<size*1.1;i++){
    const yy = srnd()*size, len = sr(size*0.2, size), x0 = srnd()*size;
    const v = si(160, 215), a = sr(.03,.09);
    x.strokeStyle = `rgba(${v},${(v*0.86)|0},${(v*0.64)|0},${a})`;
    x.lineWidth = sr(0.5, 1.4);
    x.beginPath();
    x.moveTo(x0, yy);
    x.bezierCurveTo(x0+len*0.33, yy+sr(-2.5,2.5), x0+len*0.66, yy+sr(-2.5,2.5), x0+len, yy+sr(-3,3));
    x.stroke();
  }
  // сучки: тёмные овалы с расходящимися вокруг волокнами
  for(let i=0;i<5;i++){
    const px=srnd()*size, py=srnd()*size, rr=sr(6,15), ry=rr*sr(0.45,0.75);
    wrapDraw(x, size, ()=>{
      // волокна обтекают сучок
      x.strokeStyle='rgba(126,96,54,.28)'; x.lineWidth=1.1;
      for(let k=0;k<7;k++){
        const o = (k-3)*rr*0.5;
        x.beginPath();
        x.moveTo(px-rr*3.4, py+o);
        x.quadraticCurveTo(px, py+o*sr(1.5,2.4), px+rr*3.4, py+o);
        x.stroke();
      }
      const g=x.createRadialGradient(px,py,1,px,py,rr);
      g.addColorStop(0,'rgba(74,48,24,.95)'); g.addColorStop(.62,'rgba(104,70,36,.78)');
      g.addColorStop(1,'rgba(128,92,52,0)');
      x.fillStyle=g; x.beginPath(); x.ellipse(px,py,rr,ry,sr(0,3),0,7); x.fill();
    });
    wrapDraw(hx, size, ()=>{
      const g=hx.createRadialGradient(px,py,1,px,py,rr);
      g.addColorStop(0,'rgba(54,54,54,.9)'); g.addColorStop(1,'rgba(140,140,140,0)');
      hx.fillStyle=g; hx.beginPath(); hx.ellipse(px,py,rr,ry,0,0,7); hx.fill();
    });
    wrapDraw(rx, size, ()=>{
      const g=rx.createRadialGradient(px,py,1,px,py,rr);
      g.addColorStop(0,'rgba(108,108,108,.8)'); g.addColorStop(1,'rgba(108,108,108,0)');
      rx.fillStyle=g; rx.beginPath(); rx.ellipse(px,py,rr,ry,0,0,7); rx.fill();
    });
  }
  // следы пилы и заводская маркировка-штамп
  for(let i=0;i<8;i++){
    const yy=srnd()*size;
    x.strokeStyle=`rgba(${si(160,196)},${si(140,172)},${si(110,140)},.07)`;
    x.lineWidth=sr(1.5,4);
    x.beginPath(); x.moveTo(0,yy); x.lineTo(size,yy+sr(-3,3)); x.stroke();
  }
  // серые потёртости и грязь от рук/опалубки
  for(let i=0;i<70;i++){
    const px=srnd()*size, py=srnd()*size, r=sr(10,54), v=si(120,168);
    wrapDraw(x, size, ()=>{
      const g=x.createRadialGradient(px,py,1,px,py,r);
      g.addColorStop(0,`rgba(${v},${v-6},${v-20},${sr(.05,.16)})`); g.addColorStop(1,'rgba(0,0,0,0)');
      x.fillStyle=g; x.beginPath(); x.arc(px,py,r,0,7); x.fill();
    });
    wrapDraw(rx, size, ()=>{
      const g=rx.createRadialGradient(px,py,1,px,py,r);
      g.addColorStop(0,`rgba(${si(150,210)},${si(150,210)},${si(150,210)},${sr(.08,.26)})`);
      g.addColorStop(1,'rgba(0,0,0,0)');
      rx.fillStyle=g; rx.beginPath(); rx.arc(px,py,r,0,7); rx.fill();
    });
  }
  grain(x,size,size,0.028);
  return {albedo:c, height:h, rough:rg};
}

/* ---------- Профлист (стены и кровля ангара) ---------- */
function corrugatedMaps(size=512, rust=0.5, base=[118,112,104], ribs=7){
  const [c,x] = cv(size,size);
  const [h,hx] = cv(size,size);
  const [rg,rx] = cv(size,size);
  rx.fillStyle='#8a8a8a'; rx.fillRect(0,0,size,size);
  for(let i=0;i<size;i++){
    // Трапециевидный профиль: широкая полка, наклонная стенка, узкая канавка.
    const t = (i/size*ribs) % 1;
    let prof;                                   // 0 = дно канавки, 1 = верх полки
    if(t < 0.58)      prof = 1.0;                    // широкая верхняя полка
    else if(t < 0.70) prof = 1.0 - (t-0.58)/0.12;    // стенка вниз
    else if(t < 0.88) prof = 0.06;                   // узкое дно
    else              prof = (t-0.88)/0.12;          // стенка вверх
    // мягкий перепад: дно лишь притенено, а не чёрное
    const k = 0.80 + prof*0.30 + (prof>0.08&&prof<0.94 ? -0.06 : 0);
    x.fillStyle = `rgb(${clamp(base[0]*k,0,255)|0},${clamp(base[1]*k,0,255)|0},${clamp(base[2]*k,0,255)|0})`;
    x.fillRect(i,0,1,size);
    const hv = Math.round(60 + prof*175);
    hx.fillStyle = `rgb(${hv},${hv},${hv})`; hx.fillRect(i,0,1,size);
  }
  // поперечные стыки листов
  for(let k=0;k<2;k++){
    const y = size*(0.5*k + 0.25);
    x.fillStyle='rgba(72,66,60,.3)'; x.fillRect(0,y,size,2);
    hx.fillStyle='rgba(30,30,30,.8)'; hx.fillRect(0,y,size,3);
  }
  // саморезы
  for(let k=0;k<2;k++){
    const y = size*(0.5*k + 0.25) + 1;
    for(let i=0;i<ribs;i++){
      const px = (i+0.5)*size/ribs;
      x.fillStyle='rgba(86,78,70,.5)'; x.beginPath(); x.arc(px,y,2.2,0,7); x.fill();
      hx.fillStyle='rgba(230,230,230,.9)'; hx.beginPath(); hx.arc(px,y,2.4,0,7); hx.fill();
    }
  }
  for(let i=0;i<rust*240;i++){
    const px=srnd()*size, py=srnd()*size, r=sr(3,30);
    const col = `rgba(${si(104,152)},${si(68,96)},${si(44,62)},${sr(.08,.34)})`;
    wrapDraw(x, size, ()=>{
      const g=x.createRadialGradient(px,py,1,px,py,r);
      g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)');
      x.fillStyle=g; x.beginPath(); x.arc(px,py,r,0,7); x.fill();
    });
    // ржавчина матовая: в roughness почти белая
    wrapDraw(rx, size, ()=>{
      const g=rx.createRadialGradient(px,py,1,px,py,r);
      g.addColorStop(0,`rgba(240,240,240,${sr(.2,.6)})`); g.addColorStop(1,'rgba(240,240,240,0)');
      rx.fillStyle=g; rx.beginPath(); rx.arc(px,py,r,0,7); rx.fill();
    });
  }
  // вертикальные потёки
  for(let i=0;i<22;i++){
    const px=srnd()*size, w=sr(2,9), y0=srnd()*size;
    const g=x.createLinearGradient(px,y0,px,y0+size*0.5);
    g.addColorStop(0,`rgba(${si(88,126)},${si(58,80)},${si(38,52)},.2)`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g; x.fillRect(px,y0,w,size*0.5);
  }
  grain(x,size,size,0.028);
  return {albedo:c, height:h, rough:rg};
}

/* ---------- Ржавый крашеный металл (колонны, фермы) ---------- */
function steelMaps(size=512, baseCol=[64,60,58]){
  const [c,x] = cv(size,size);
  const [h,hx] = cv(size,size);
  const [rg,rx] = cv(size,size);
  rx.fillStyle='#6e6e6e'; rx.fillRect(0,0,size,size);
  x.fillStyle=`rgb(${baseCol[0]},${baseCol[1]},${baseCol[2]})`; x.fillRect(0,0,size,size);
  hx.fillStyle='#b4b4b4'; hx.fillRect(0,0,size,size);
  // облезшая краска
  for(let i=0;i<420;i++){
    const px=srnd()*size, py=srnd()*size, r=sr(3,26);
    const col=`rgba(${si(96,156)},${si(58,90)},${si(36,56)},${sr(.14,.58)})`;
    wrapDraw(x, size, ()=>{
      const g=x.createRadialGradient(px,py,1,px,py,r);
      g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)');
      x.fillStyle=g; x.beginPath(); x.arc(px,py,r,0,7); x.fill();
    });
    wrapDraw(rx, size, ()=>{
      const g=rx.createRadialGradient(px,py,1,px,py,r);
      g.addColorStop(0,`rgba(235,235,235,${sr(.25,.7)})`); g.addColorStop(1,'rgba(235,235,235,0)');
      rx.fillStyle=g; rx.beginPath(); rx.arc(px,py,r,0,7); rx.fill();
    });
    wrapDraw(hx, size, ()=>{
      const hv=si(130,190);
      hx.fillStyle=`rgba(${hv},${hv},${hv},.25)`;
      hx.beginPath(); hx.arc(px,py,r*0.6,0,7); hx.fill();
    });
  }
  // потёки ржавчины
  for(let i=0;i<26;i++){
    const px=srnd()*size, w=sr(1.5,7), y0=srnd()*size;
    const g=x.createLinearGradient(px,y0,px,y0+size*0.6);
    g.addColorStop(0,`rgba(${si(96,152)},${si(52,82)},${si(24,44)},.42)`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g; x.fillRect(px,y0,w,size*0.6);
  }
  grain(x,size,size,0.045);
  return {albedo:c, height:h, rough:rg};
}

/* ---------- Бетонная панель цоколя ---------- */
function panelMaps(size=768){
  const [c,x] = cv(size,size);
  const [h,hx] = cv(size,size);
  const [rg,rx] = cv(size,size);
  x.fillStyle='#8a8884'; x.fillRect(0,0,size,size);
  hx.fillStyle='#b0b0b0'; hx.fillRect(0,0,size,size);
  rx.fillStyle='#dcdcdc'; rx.fillRect(0,0,size,size);
  for(let i=0;i<420;i++){
    const v=si(112,162), px=srnd()*size, py=srnd()*size, r=sr(6,40);
    wrapDraw(x, size, ()=>{ x.fillStyle=`rgba(${v},${v-2},${v-8},${sr(.04,.16)})`;
      x.beginPath(); x.arc(px,py,r,0,7); x.fill(); });
  }
  // поры и сколы
  for(let i=0;i<1500;i++){
    const px=srnd()*size, py=srnd()*size, r=sr(0.6,2.6), hv=si(118,150);
    wrapDraw(hx, size, ()=>{ hx.fillStyle=`rgba(${hv},${hv},${hv},.5)`;
      hx.beginPath(); hx.arc(px,py,r,0,7); hx.fill(); });
  }
  // швы панелей
  const seam = (x0,y0,x1,y1)=>{
    x.strokeStyle='rgba(66,62,56,.55)'; x.lineWidth=4;
    x.beginPath(); x.moveTo(x0,y0); x.lineTo(x1,y1); x.stroke();
    hx.strokeStyle='rgba(48,48,48,.95)'; hx.lineWidth=6;
    hx.beginPath(); hx.moveTo(x0,y0); hx.lineTo(x1,y1); hx.stroke();
  };
  seam(0,0,size,0); seam(0,size-2,size,size-2);
  seam(0,size/2,size,size/2); seam(0,0,0,size); seam(size-2,0,size-2,size);
  // потёки от дождя сверху
  for(let i=0;i<26;i++){
    const px=srnd()*size, w=sr(4,26);
    const g=x.createLinearGradient(px,0,px,size);
    g.addColorStop(0,'rgba(58,52,44,.34)'); g.addColorStop(.6,'rgba(58,52,44,.08)'); g.addColorStop(1,'rgba(58,52,44,0)');
    x.fillStyle=g; x.fillRect(px,0,w,size);
  }
  // мох/грязь понизу
  const gm = x.createLinearGradient(0,size*0.72,0,size);
  gm.addColorStop(0,'rgba(48,50,40,0)'); gm.addColorStop(1,'rgba(48,50,40,.38)');
  x.fillStyle=gm; x.fillRect(0,size*0.72,size,size*0.28);
  // мокрые подтёки — глянцевее сухого бетона
  for(let i=0;i<20;i++){
    const px=srnd()*size, w=sr(6,30);
    const g=rx.createLinearGradient(px,0,px,size);
    g.addColorStop(0,`rgba(120,120,120,${sr(.2,.45)})`); g.addColorStop(1,'rgba(120,120,120,0)');
    rx.fillStyle=g; rx.fillRect(px,0,w,size);
  }
  grain(x,size,size,0.03);
  return {albedo:c, height:h, rough:rg};
}

/* ---------- Граффити: крупные росписи во всю стену, как в референсе ---------- */
function graffitiTex(kind, w=512, h=512){
  const [c,x] = cv(w,h);
  x.clearRect(0,0,w,h);
  x.lineCap='round'; x.lineJoin='round';
  // Выгоревшие, приглушённые пигменты: свежая яркая краска выглядит наклейкой.
  const pal = [
    ['#6e3630','#9a8244','#3b4152'], ['#33415c','#6b4560','#a8aaa8'],
    ['#3c3832','#8a5340','#a89a7c'], ['#47523c','#7a4038','#b0aa9a']
  ][kind % 4];
  const A = pal[0], B = pal[1], C = pal[2];

  if(kind % 4 === 0){
    // вертикальные фигуры-«тотемы», как на референсе с балконом
    const n = si(4,6);
    for(let i=0;i<n;i++){
      const cx = w*(i+0.5)/n, cw = w/n*0.72;
      x.fillStyle = i%2 ? A : C; x.globalAlpha = sr(.55,.85);
      x.beginPath();
      x.moveTo(cx, h*0.10);
      x.bezierCurveTo(cx+cw*0.5, h*0.28, cx+cw*0.32, h*0.62, cx+cw*0.16, h*0.92);
      x.lineTo(cx-cw*0.16, h*0.92);
      x.bezierCurveTo(cx-cw*0.32, h*0.62, cx-cw*0.5, h*0.28, cx, h*0.10);
      x.fill();
      x.globalAlpha = sr(.5,.8); x.fillStyle = B;
      x.beginPath(); x.arc(cx, h*0.20, cw*0.19, 0, 7); x.fill();
      x.strokeStyle = '#1a1a1c'; x.globalAlpha=.5; x.lineWidth = 3;
      x.beginPath(); x.moveTo(cx-cw*0.2, h*0.5); x.lineTo(cx+cw*0.2, h*0.55); x.stroke();
    }
  } else if(kind % 4 === 1){
    // объёмный бабл-тэг
    x.globalAlpha=.8;
    const txt = spick(['RAID','OSB','KILO','7-2','VOID']);
    x.font = `900 ${Math.round(h*0.34)}px "Arial Black",Impact,sans-serif`;
    x.textAlign='center'; x.textBaseline='middle';
    x.lineWidth = h*0.055; x.strokeStyle = C; x.strokeText(txt, w/2, h*0.46);
    x.fillStyle = A; x.fillText(txt, w/2, h*0.46);
    x.lineWidth = h*0.012; x.strokeStyle='#131316'; x.strokeText(txt, w/2, h*0.46);
    x.globalAlpha=.6; x.fillStyle=B;
    x.fillText(txt, w/2 + h*0.02, h*0.46 + h*0.022);
    x.globalAlpha=.75; x.fillStyle = A; x.fillText(txt, w/2, h*0.46);
    x.globalAlpha=.55; x.strokeStyle=B; x.lineWidth=h*0.02;
    x.beginPath(); x.moveTo(w*0.08,h*0.76); x.bezierCurveTo(w*0.35,h*0.66,w*0.65,h*0.92,w*0.93,h*0.72); x.stroke();
  } else if(kind % 4 === 2){
    // мурал: крупное лицо/маска абстракцией
    x.globalAlpha=.72; x.fillStyle=C;
    x.beginPath(); x.ellipse(w/2, h*0.5, w*0.31, h*0.38, 0, 0, 7); x.fill();
    x.globalAlpha=.85; x.fillStyle=A;
    x.beginPath(); x.ellipse(w*0.39, h*0.42, w*0.065, h*0.042, -0.25, 0, 7); x.fill();
    x.beginPath(); x.ellipse(w*0.61, h*0.42, w*0.065, h*0.042, 0.25, 0, 7); x.fill();
    x.strokeStyle=B; x.lineWidth=h*0.03; x.globalAlpha=.8;
    x.beginPath(); x.moveTo(w*0.40,h*0.66); x.quadraticCurveTo(w*0.5,h*0.74,w*0.60,h*0.66); x.stroke();
    x.lineWidth=h*0.016; x.strokeStyle='#17171a'; x.globalAlpha=.6;
    x.beginPath(); x.ellipse(w/2, h*0.5, w*0.31, h*0.38, 0, 0, 7); x.stroke();
  } else {
    // рваный «drip»-тэг с потёками
    x.globalAlpha=.8; x.strokeStyle=A; x.lineWidth=h*0.07;
    x.beginPath(); x.moveTo(w*0.1,h*0.62);
    for(let i=0;i<6;i++) x.quadraticCurveTo(w*(0.1+i*0.16), h*(i%2?0.24:0.82), w*(0.2+i*0.15), h*0.55);
    x.stroke();
    x.lineWidth=h*0.02; x.strokeStyle=C; x.globalAlpha=.7;
    x.beginPath(); x.moveTo(w*0.1,h*0.66);
    for(let i=0;i<6;i++) x.quadraticCurveTo(w*(0.1+i*0.16), h*(i%2?0.3:0.86), w*(0.2+i*0.15), h*0.6);
    x.stroke();
    for(let i=0;i<14;i++){    // потёки краски вниз
      const px = w*sr(0.12,0.9), py = h*sr(0.5,0.72), len = h*sr(0.05,0.26);
      x.globalAlpha=sr(.35,.7); x.strokeStyle=A; x.lineWidth=sr(3,9);
      x.beginPath(); x.moveTo(px,py); x.lineTo(px+sr(-4,4),py+len); x.stroke();
    }
  }
  // аэрозольная пыль по краям штрихов
  x.globalAlpha=1;
  const img = x.getImageData(0,0,w,h), d = img.data;
  for(let i=0;i<2600;i++){
    const px = Math.floor(srnd()*w), py = Math.floor(srnd()*h);
    const k = (py*w+px)*4;
    if(d[k+3] > 30) continue;
    // проверяем соседей: рисуем пыль только рядом с краской
    let near = false;
    for(let o=-6;o<=6 && !near;o+=3) for(let p=-6;p<=6 && !near;p+=3){
      const kk = (clamp(py+p,0,h-1)*w + clamp(px+o,0,w-1))*4;
      if(d[kk+3] > 90) near = true;
    }
    if(!near) continue;
    const col = [A,B,C][Math.floor(srnd()*3)];
    x.fillStyle = col; x.globalAlpha = sr(.05,.3);
    x.fillRect(px,py,sr(1,2.6),sr(1,2.6));
  }
  x.globalAlpha=1;
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = MAXA();
  return t;
}

/* ---------- Плакаты/наклейки на стенах ---------- */
function posterTex(kind){
  const [c,x] = cv(256,360);
  const bg = ['#c9c3b4','#b8bcc0','#cbbf9e'][kind%3];
  x.fillStyle=bg; x.fillRect(0,0,256,360);
  x.fillStyle='#22242a';
  x.fillRect(16,20,224,52);
  x.fillStyle=bg; x.font='900 30px "Arial Black",Impact,sans-serif'; x.textAlign='center';
  x.fillText(['DANGER','CAUTION','NO ENTRY'][kind%3], 128, 56);
  x.fillStyle='#22242a'; x.font='bold 16px Arial';
  const lines = [['HARD HAT','AREA','ЗОНА РАБОТ'],['UNFINISHED','STRUCTURE','НЕ ВХОДИТЬ'],['AUTHORIZED','PERSONNEL','ONLY']][kind%3];
  lines.forEach((s,i)=> x.fillText(s, 128, 112+i*28));
  // пиктограмма
  x.strokeStyle='#22242a'; x.lineWidth=6;
  x.beginPath(); x.arc(128,250,52,0,7); x.stroke();
  x.beginPath(); x.moveTo(128,212); x.lineTo(128,262); x.stroke();
  x.beginPath(); x.arc(128,282,5,0,7); x.fillStyle='#22242a'; x.fill();
  // потрёпанность
  for(let i=0;i<180;i++){
    x.fillStyle=`rgba(${si(60,130)},${si(58,124)},${si(54,116)},${sr(.05,.3)})`;
    x.fillRect(srnd()*256, srnd()*360, sr(2,16), sr(1,8));
  }
  for(let i=0;i<5;i++){  // надрывы по краю
    x.clearRect(srnd()*256, srnd()<0.5?0:340, sr(10,40), sr(6,20));
  }
  grain(x,256,360,0.05);
  const t = new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=MAXA();
  return t;
}
/* ---------- Пятна на полу (лужи краски, грязь) ---------- */
/** Мутное армированное стекло: разводы, пыль, сетка. */
function dirtyGlassMaps(size=256){
  const [c,x] = cv(size,size);
  x.fillStyle='#d8e4ee'; x.fillRect(0,0,size,size);
  // потёки и налёт
  for(let i=0;i<70;i++){
    const px=srnd()*size, w=sr(3,26);
    const g=x.createLinearGradient(px,0,px,size);
    g.addColorStop(0,`rgba(${si(120,168)},${si(126,172)},${si(120,166)},${sr(.08,.3)})`);
    g.addColorStop(1,'rgba(150,155,150,0)');
    x.fillStyle=g; x.fillRect(px,0,w,size);
  }
  for(let i=0;i<120;i++){
    const px=srnd()*size, py=srnd()*size, r=sr(4,30);
    wrapDraw(x, size, ()=>{
      const g=x.createRadialGradient(px,py,1,px,py,r);
      g.addColorStop(0,`rgba(${si(140,190)},${si(144,192)},${si(138,186)},${sr(.05,.22)})`);
      g.addColorStop(1,'rgba(0,0,0,0)');
      x.fillStyle=g; x.beginPath(); x.arc(px,py,r,0,7); x.fill();
    });
  }
  // армирующая сетка
  x.strokeStyle='rgba(126,132,128,.30)'; x.lineWidth=1.1;
  for(let i=0;i<=size;i+=size/10){
    x.beginPath(); x.moveTo(i,0); x.lineTo(i,size); x.stroke();
    x.beginPath(); x.moveTo(0,i); x.lineTo(size,i); x.stroke();
  }
  grain(x,size,size,0.03);
  return c;
}
function stainTex(){
  const [c,x] = cv(256,256);
  x.clearRect(0,0,256,256);
  const col = spick(['rgba(58,52,44,','rgba(42,46,38,','rgba(70,54,40,','rgba(46,44,48,']);
  const cx=128, cy=128;
  x.fillStyle = col+'0.5)';
  x.beginPath();
  const pts = 16;
  for(let i=0;i<=pts;i++){
    const a = i/pts*Math.PI*2, r = 60 + Math.sin(a*3+SEED)*18 + sr(-16,16);
    const px = cx+Math.cos(a)*r, py = cy+Math.sin(a)*r;
    i ? x.lineTo(px,py) : x.moveTo(px,py);
  }
  x.closePath(); x.fill();
  for(let i=0;i<9;i++){   // брызги
    const a=sr(0,6.28), d=sr(60,118);
    x.globalAlpha=sr(.2,.5);
    x.beginPath(); x.arc(cx+Math.cos(a)*d, cy+Math.sin(a)*d, sr(3,13),0,7); x.fill();
  }
  x.globalAlpha=1;
  // размытие краёв
  const img=x.getImageData(0,0,256,256), d=img.data;
  for(let i=3;i<d.length;i+=4){
    const px=((i-3)/4)%256, py=Math.floor(((i-3)/4)/256);
    const dist = Math.hypot(px-128,py-128);
    d[i] = d[i]*clamp(1.25 - dist/110, 0, 1);
  }
  x.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=MAXA();
  return t;
}

/* ============================================================================
   МАТЕРИАЛЫ
============================================================================ */
const MAPS = {}, M = {};
function buildMaterials(){
  const mk = (maps, rep, normScale, opts={}) => {
    const albedo = T(maps.albedo, rep[0], rep[1]);
    const normal = T(heightToNormal(maps.height, opts.hStrength ?? 2.4), rep[0], rep[1], false);
    // Карта шероховатости: без неё вся поверхность блестит одинаково и выглядит пластиком.
    const roughMap = maps.rough ? T(maps.rough, rep[0], rep[1], false) : null;
    // AO из карты высот: затемняет углубления (швы, стыки, каверны).
    const aoMap = T(heightToAO(maps.height, opts.aoPower ?? 1.0), rep[0], rep[1], false);
    const mat = new THREE.MeshStandardMaterial({
      map: albedo, normalMap: normal,
      normalScale: new THREE.Vector2(normScale, normScale),
      roughnessMap: roughMap,
      aoMap, aoMapIntensity: opts.ao ?? 0.85,
      roughness: opts.rough ?? 0.92, metalness: opts.metal ?? 0.0,
      side: opts.side ?? THREE.FrontSide,
      envMapIntensity: opts.env ?? 0.55
    });
    return mat;
  };
  MAPS.osb   = osbMaps(1024, 1.0);
  MAPS.osb2  = osbMaps(1024, 0.92);
  MAPS.conc  = concreteMaps(768);
  MAPS.wood  = lumberMaps(768);
  MAPS.corr  = corrugatedMaps(512, 0.45, [124,118,110], 7);
  MAPS.roof  = corrugatedMaps(512, 0.62, [168,154,136], 6);
  MAPS.steel = steelMaps(512, [112,106,98]);
  MAPS.panel = panelMaps(768);

  // roughness берётся из карт; числовое значение работает множителем
  M.osb   = mk(MAPS.osb , [1,1], 1.05, {rough:1.0, hStrength:2.2, ao:.95, env:.28});
  M.osb2  = mk(MAPS.osb2, [1,1], 1.05, {rough:1.0, hStrength:2.2, ao:.95, env:.28});
  M.conc  = mk(MAPS.conc, [1,1], 0.80, {rough:1.0, ao:.95, env:.22, aoPower:1.15});
  M.wood  = mk(MAPS.wood, [1,1], 0.5, {rough:1.0, ao:.75, env:.28, hStrength:1.2});
  M.corr  = mk(MAPS.corr, [1,1], 1.20, {rough:1.0, metal:.25, side:THREE.DoubleSide, env:1.0, ao:.6});
  M.roof  = mk(MAPS.roof, [1,1], 1.15, {rough:1.0, metal:.15, side:THREE.DoubleSide, env:1.0, ao:.55});
  M.steel = mk(MAPS.steel,[1,1], 0.95, {rough:1.0, metal:.35, env:1.0, ao:.6});
  M.panel = mk(MAPS.panel,[1,1], 0.95, {rough:1.0, ao:.95, env:.25, aoPower:1.1});

  // Крашеный металл: приглушённые, выгоревшие цвета вместо ярких «пластиковых».
  M.dark   = new THREE.MeshStandardMaterial({color:0x4a463f, roughness:.7, metalness:.3, envMapIntensity:1.1});
  M.darker = new THREE.MeshStandardMaterial({color:0x262320, roughness:.78, metalness:.45});
  M.rubber = new THREE.MeshStandardMaterial({color:0x1a1b1d, roughness:.94, metalness:.03});
  M.plastO = new THREE.MeshStandardMaterial({color:0x9c5734, roughness:.66, metalness:.05});
  M.plastB = new THREE.MeshStandardMaterial({color:0x3a5470, roughness:.66, metalness:.06});
  M.paintG = new THREE.MeshStandardMaterial({color:0x4e5a46, roughness:.68, metalness:.22});
  M.paintY = new THREE.MeshStandardMaterial({color:0xa88a4c, roughness:.66, metalness:.25});
  // Без transmission: он требует отдельного прохода рендера, стоит дорого и
  // на части драйверов роняет кадр в чёрный. Грязное стекло даёт тот же вид дешевле.
  M.glass  = new THREE.MeshStandardMaterial({
    color:0xc4cfd6, roughness:.46, metalness:0, side:THREE.DoubleSide,
    transparent:true, opacity:.78, emissive:0xd8dee4, emissiveIntensity:0.42,
    map: T(dirtyGlassMaps(256), 1, 1)
  });
  M.tarp   = new THREE.MeshStandardMaterial({color:0x545a52, roughness:.92, side:THREE.DoubleSide});
  M.foam   = new THREE.MeshStandardMaterial({color:0xbdb6a4, roughness:.97});
  M.cable  = new THREE.MeshStandardMaterial({color:0x222326, roughness:.82});
  M.dirt   = new THREE.MeshStandardMaterial({color:0x6a6154, roughness:.98});
}

/* ============================================================================
   СБОРКА ГЕОМЕТРИИ
============================================================================ */
const BUCKET = new Map();
const COLLIDERS = [];
const SHOOTABLE = [];
function bucket(k){ if(!BUCKET.has(k)) BUCKET.set(k,[]); return BUCKET.get(k); }
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v = new THREE.Vector3();

/** UV по мировому размеру: текстура не растягивается на больших гранях. */
function uvBox(g, sx,sy,sz, d, alignGrain){
  const uv = g.attributes.uv;
  const s = [[sz,sy],[sz,sy],[sx,sz],[sx,sz],[sx,sy],[sx,sy]];
  for(let f=0; f<6; f++) for(let i=0;i<4;i++){
    const k = f*4+i;
    let u = uv.getX(k)*s[f][0]*d, v = uv.getY(k)*s[f][1]*d;
    // Текстура дерева нарисована волокном вдоль U. Если длинная сторона грани
    // идёт по V, меняем оси — иначе слои ложатся поперёк бруса.
    if(alignGrain && s[f][1] > s[f][0]){ const t=u; u=v; v=t; }
    uv.setXY(k, u, v);
  }
  uv.needsUpdate = true;
}
/** Подмешивает в геометрию вершинный цвет: каждый лист обшивки получает
    свой оттенок, иначе стена выглядит как один плоский залив. */
function tintGeo(g, r, gg, b){
  const n = g.attributes.position.count;
  const col = new Float32Array(n*3);
  for(let i=0;i<n;i++){ col[i*3]=r; col[i*3+1]=gg; col[i*3+2]=b; }
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  return g;
}
function addBox(mat, cx,cy,cz, sx,sy,sz, o={}){
  const g = new THREE.BoxGeometry(sx,sy,sz);
  uvBox(g, sx,sy,sz, o.d ?? 0.5);
  if(o.rotY || o.rotX || o.rotZ){
    _e.set(o.rotX||0, o.rotY||0, o.rotZ||0); _q.setFromEuler(_e);
  } else _q.identity();
  _m4.compose(new THREE.Vector3(cx,cy,cz), _q, new THREE.Vector3(1,1,1));
  g.applyMatrix4(_m4);
  if(o.tint) tintGeo(g, o.tint[0], o.tint[1], o.tint[2]);
  bucket(mat).push(g);
  if(o.collide !== false) addAABB(cx,cy,cz,sx,sy,sz,o.rotY||0);
  return g;
}
function addAABB(cx,cy,cz,sx,sy,sz,rotY=0){
  let ex=sx/2, ez=sz/2;
  if(rotY){ const c=Math.abs(Math.cos(rotY)), s=Math.abs(Math.sin(rotY));
            const nx=ex*c+ez*s, nz=ex*s+ez*c; ex=nx; ez=nz; }
  COLLIDERS.push({x0:cx-ex,y0:cy-sy/2,z0:cz-ez, x1:cx+ex,y1:cy+sy/2,z1:cz+ez});
}
function flushBuckets(){
  for(const [k, arr] of BUCKET){
    if(!arr.length) continue;
    // мердж требует одинаковый набор атрибутов: дополняем белым там, где цвета нет
    if(arr.some(g=>g.attributes.color)){
      for(const g of arr) if(!g.attributes.color) tintGeo(g,1,1,1);
      if(M[k]) M[k].vertexColors = true;
    }
    const merged = BGU.mergeGeometries(arr, false);
    merged.computeBoundingSphere();
    const mesh = new THREE.Mesh(merged, M[k]);
    mesh.castShadow = true; mesh.receiveShadow = true;
    mesh.name = 'm_'+k;
    scene.add(mesh); SHOOTABLE.push(mesh);
    arr.length = 0;
  }
}

/* ============================================================================
   АНГАР
   Кровля собирается из полос с реальными пропусками — сквозь них светит солнце.
============================================================================ */
const HW = 27, HD = 19;            // полуразмеры ангара (54 x 38 м)
const WALL_H = 5.6;                // верх бетонного цоколя + низ остекления
const EAVE = 9.2, RIDGE = 12.6;    // карниз и конёк
const roofY = z => EAVE + (RIDGE-EAVE)*(1 - Math.abs(z)/HD);
const LAMPS = [], SUNHOLES = [], WINDOWS = [];

function buildHangar(){
  /* --- пол: плиты 6x6 м с небольшим разбросом оттенка --- */
  const tiles = [];
  for(let i=0;i<Math.ceil(HW*2/6);i++) for(let j=0;j<Math.ceil(HD*2/6);j++){
    const x0 = -HW + i*6, z0 = -HD + j*6;
    const x1 = Math.min(x0+6, HW), z1 = Math.min(z0+6, HD);
    const g = new THREE.PlaneGeometry(x1-x0, z1-z0);
    g.rotateX(-Math.PI/2); g.translate((x0+x1)/2, 0, (z0+z1)/2);
    const uv = g.attributes.uv;
    // Случайный сдвиг И поворот UV на плиту: одинаковый тайл перестаёт читаться.
    const rot = Math.floor(srnd()*4)*Math.PI/2, cs=Math.cos(rot), sn=Math.sin(rot);
    const ou = srnd()*7, ov = srnd()*7;
    for(let k=0;k<uv.count;k++){
      const u0 = uv.getX(k)*(x1-x0)*0.42, v0 = uv.getY(k)*(z1-z0)*0.42;
      uv.setXY(k, u0*cs - v0*sn + ou, u0*sn + v0*cs + ov);
    }
    tiles.push(g);
    // деформационный шов по краю плиты
    if(x1 < HW-0.01) addBox('darker', x1, 0.004, (z0+z1)/2, 0.035, 0.03, z1-z0, {collide:false, d:1});
    if(z1 < HD-0.01) addBox('darker', (x0+x1)/2, 0.004, z1, x1-x0, 0.03, 0.035, {collide:false, d:1});
  }
  const floor = new THREE.Mesh(BGU.mergeGeometries(tiles,false), M.conc);
  floor.receiveShadow = true; floor.name='floor';
  scene.add(floor); SHOOTABLE.push(floor);
  COLLIDERS.push({x0:-HW-2,y0:-2,z0:-HD-2,x1:HW+2,y1:0,z1:HD+2});

  /* --- стены: бетонный цоколь, ленточное остекление, профлист фронтона --- */
  const GLASS_Y0 = WALL_H, GLASS_H = 2.3;
  const wallSeg = (cx,cz,sx,sz)=>{
    addBox('panel', cx, WALL_H/2, cz, sx, WALL_H, sz, {d:.30});
  };
  wallSeg(0, -HD, HW*2+0.4, .44);  wallSeg(0, HD, HW*2+0.4, .44);
  wallSeg(-HW, 0, .44, HD*2);      wallSeg( HW, 0, .44, HD*2);

  // рама остекления + стёкла (длинные ленты под карнизом)
  function glazing(axis, sign){
    const along = axis==='x' ? HW : HD;
    const n = axis==='x' ? 11 : 8;
    for(let i=0;i<n;i++){
      const t = -along + (i+0.5)*(along*2/n);
      const wseg = (along*2/n) * 0.82;
      const px = axis==='x' ? t : sign*HW, pz = axis==='x' ? sign*HD : t;
      const yc = GLASS_Y0 + GLASS_H/2;
      const g = new THREE.PlaneGeometry(wseg, GLASS_H);
      const m = new THREE.Mesh(g, M.glass);
      m.position.set(px, yc, pz);
      m.rotation.y = axis==='x' ? (sign>0 ? Math.PI : 0) : (sign>0 ? -Math.PI/2 : Math.PI/2);
      scene.add(m);
      WINDOWS.push({pos:new THREE.Vector3(px,yc,pz), axis, sign, w:wseg, h:GLASS_H});
      // переплёт
      const inw = axis==='x' ? 0 : -sign*0.06, ind = axis==='x' ? -sign*0.06 : 0;
      const cols = 5;
      for(let k=0;k<=cols;k++){
        const off = -wseg/2 + k*wseg/cols;
        const bx = axis==='x' ? px+off : px+inw, bz = axis==='x' ? pz+ind : pz+off;
        addBox('dark', bx, yc, bz, axis==='x'?0.05:0.1, GLASS_H, axis==='x'?0.1:0.05, {collide:false, d:1});
      }
      for(const yy of [GLASS_Y0+0.02, GLASS_Y0+GLASS_H-0.02]){
        const bx = axis==='x' ? px : px+inw, bz = axis==='x' ? pz+ind : pz;
        addBox('dark', bx, yy, bz, axis==='x'?wseg:0.1, 0.07, axis==='x'?0.1:wseg, {collide:false, d:1});
      }
    }
    // сплошной профлист между остеклением и карнизом
    const topY0 = GLASS_Y0 + GLASS_H, topH = EAVE - topY0;
    if(topH > 0.1){
      if(axis==='x') addBox('corr', 0, topY0+topH/2, sign*HD, HW*2+0.4, topH, .3, {d:.45});
      else           addBox('corr', sign*HW, topY0+topH/2, 0, .3, topH, HD*2, {d:.45});
    }
  }
  glazing('x',-1); glazing('x',1); glazing('z',-1); glazing('z',1);

  // Фронтоны. Конёк идёт вдоль X, значит скат меняет высоту по Z —
  // треугольные щипцы закрывают торцы по X, а не по Z.
  for(const s of [-1,1]){
    const shape = new THREE.Shape();
    shape.moveTo(-HD, EAVE); shape.lineTo(HD, EAVE); shape.lineTo(0, RIDGE);
    const g = new THREE.ShapeGeometry(shape);
    const uv = g.attributes.uv;
    for(let i=0;i<uv.count;i++) uv.setXY(i, uv.getX(i)*0.42, uv.getY(i)*0.42);
    const m = new THREE.Mesh(g, M.corr);
    m.position.set(s*HW, 0, 0);
    m.rotation.y = s>0 ? Math.PI/2 : -Math.PI/2;
    m.castShadow = true; m.receiveShadow = true;
    scene.add(m); SHOOTABLE.push(m);
    // стойки щипца
    for(const zz of [-HD*0.5, 0, HD*0.5]){
      const top = roofY(zz);
      if(top - EAVE < 0.15) continue;
      addBox('steel', s*HW, (EAVE+top)/2, zz, 0.2, top-EAVE, 0.14, {collide:false, d:1.2});
    }
  }
  // по торцам Z скат заканчивается на карнизе — там простой парапет
  for(const s of [-1,1]) addBox('corr', 0, EAVE+0.18, s*HD, HW*2+0.4, 0.36, 0.3, {collide:false, d:.6});

  /* --- каркас: колонны, фермы, прогоны --- */
  const colX = [-22.5,-15,-7.5,0,7.5,15,22.5];
  for(const cx of colX){
    for(const cz of [-HD+0.6, HD-0.6]){
      // двутавр из трёх пластин
      addBox('steel', cx, EAVE/2, cz, 0.42, EAVE, 0.10, {d:1.1});
      addBox('steel', cx, EAVE/2, cz-0.14, 0.14, EAVE, 0.28, {collide:false, d:1.1});
      addBox('steel', cx, EAVE/2, cz+0.14, 0.14, EAVE, 0.28, {collide:false, d:1.1});
      addBox('dark', cx, 0.12, cz, 0.62, 0.24, 0.62, {d:1.2});       // база
      addBox('steel', cx, EAVE-0.5, cz + (cz<0?0.55:-0.55), 0.3, 0.9, 1.3, {collide:false, d:1});
    }
  }
  // стропильные фермы поперёк ангара
  for(const cx of colX){
    const segs = 14;
    for(let i=0;i<segs;i++){
      const z0 = -HD + i*(HD*2/segs), z1 = -HD + (i+1)*(HD*2/segs);
      const y0 = roofY(z0), y1 = roofY(z1);
      // верхний пояс
      const len = Math.hypot(z1-z0, y1-y0);
      const g = new THREE.BoxGeometry(0.16, 0.20, len);
      uvBox(g, 0.16,0.2,len, 1.2);
      _e.set(Math.atan2(y1-y0, z1-z0)*-1, 0, 0); _q.setFromEuler(_e);
      _m4.compose(new THREE.Vector3(cx,(y0+y1)/2-0.12,(z0+z1)/2), _q, new THREE.Vector3(1,1,1));
      g.applyMatrix4(_m4); bucket('steel').push(g);
      // нижний пояс и раскосы
      const by = EAVE - 0.15;
      addBox('steel', cx, by, (z0+z1)/2, 0.14, 0.16, z1-z0, {collide:false, d:1.2});
      const dy = (y0+y1)/2 - 0.2 - by;
      if(dy > 0.25){
        addBox('steel', cx, by + dy/2, (z0+z1)/2, 0.09, dy, 0.09, {collide:false, d:1.2});
        const dl = Math.hypot(dy, (z1-z0));
        const gd = new THREE.BoxGeometry(0.07, 0.07, dl); uvBox(gd,0.07,0.07,dl,1.2);
        _e.set(Math.atan2(dy, z1-z0)*-1, 0, 0); _q.setFromEuler(_e);
        _m4.compose(new THREE.Vector3(cx, by+dy/2, (z0+z1)/2), _q, new THREE.Vector3(1,1,1));
        gd.applyMatrix4(_m4); bucket('steel').push(gd);
      }
    }
  }
  // продольные прогоны под кровлей
  for(let i=0;i<=18;i++){
    const z = -HD + i*(HD*2/18);
    addBox('steel', 0, roofY(z)-0.30, z, HW*2, 0.11, 0.13, {collide:false, d:1.4});
  }
  // горизонтальные связи по верху колонн
  for(const cz of [-HD+0.6, HD-0.6]) addBox('steel', 0, EAVE-0.15, cz, HW*2, 0.18, 0.14, {collide:false, d:1.4});
}

/* --- кровля: полосы профлиста с реальными пропусками под световые проёмы --- */
function buildRoof(){
  // сетка проёмов: часть закрыта поликарбонатом, часть — сквозные дыры (солнце бьёт столбом)
  const holes = [];
  for(let i=0;i<9;i++){
    const x = -22 + i*5.6 + sr(-0.8,0.8);
    const z = (i%2 ? 1 : -1) * sr(4.5, 14);
    const w = sr(2.4,3.6), d = sr(1.8,2.8);
    holes.push({x, z, w, d, open: srnd() < 0.45});
  }
  // пара крупных провалов у конька — главный источник световых столбов
  holes.push({x:-6.5, z:2.0, w:4.6, d:3.4, open:true});
  holes.push({x:11.5, z:-3.5, w:4.0, d:3.0, open:true});

  const stripN = 26;                                  // полосы вдоль X, режем по Z
  for(let i=0;i<stripN;i++){
    const z0 = -HD + i*(HD*2/stripN), z1 = -HD + (i+1)*(HD*2/stripN);
    const zc = (z0+z1)/2;
    // сегменты по X с вырезами под проёмы, пересекающие эту полосу
    let spans = [[-HW-0.3, HW+0.3]];
    for(const h of holes){
      if(zc < h.z-h.d/2 || zc > h.z+h.d/2) continue;
      const nx = [];
      for(const [a,b] of spans){
        const c0 = h.x-h.w/2, c1 = h.x+h.w/2;
        if(c1 <= a || c0 >= b){ nx.push([a,b]); continue; }
        if(a < c0) nx.push([a,c0]);
        if(c1 < b) nx.push([c1,b]);
      }
      spans = nx;
    }
    for(const [a,b] of spans){
      if(b-a < 0.12) continue;
      const y0 = roofY(z0), y1 = roofY(z1);
      const len = Math.hypot(z1-z0, y1-y0);
      const g = new THREE.PlaneGeometry(b-a, len);
      const uv = g.attributes.uv;
      for(let k=0;k<uv.count;k++) uv.setXY(k, uv.getX(k)*(b-a)*0.30, uv.getY(k)*len*0.30);
      const m = new THREE.Mesh(g, M.roof);
      m.position.set((a+b)/2, (y0+y1)/2, zc);
      m.rotation.x = -Math.PI/2 + Math.atan2(y1-y0, z1-z0);
      m.castShadow = true; m.receiveShadow = true;
      m.name = 'roofstrip';
      scene.add(m); SHOOTABLE.push(m);
    }
  }
  // конёк
  addBox('roof', 0, RIDGE+0.06, 0, HW*2+0.6, 0.12, 0.85, {collide:false, d:1.2});
  // остекление/поликарбонат в закрытых проёмах + регистрация открытых для лучей
  for(const h of holes){
    const y = roofY(h.z);
    if(!h.open){
      const g = new THREE.PlaneGeometry(h.w, h.d);
      const m = new THREE.Mesh(g, M.glass);
      m.position.set(h.x, y-0.02, h.z); m.rotation.x = -Math.PI/2;
      scene.add(m);
    }
    // обрамление проёма
    addBox('steel', h.x, y-0.08, h.z-h.d/2, h.w+0.2, 0.12, 0.12, {collide:false, d:1.2});
    addBox('steel', h.x, y-0.08, h.z+h.d/2, h.w+0.2, 0.12, 0.12, {collide:false, d:1.2});
    SUNHOLES.push({x:h.x, y, z:h.z, w:h.w, d:h.d, open:h.open});
  }
  // пара дыр в стене профлиста (пробоины, как в заброшке)
  for(let i=0;i<3;i++){
    const zz = sr(-14,14);
    addBox('darker', -HW+0.3, WALL_H+2.8, zz, 0.06, sr(0.6,1.4), sr(0.5,1.2), {collide:false, d:1});
  }
}

/* ============================================================================
   КАРКАСНОЕ ЗДАНИЕ: стены, перекрытия с опорами, лестницы
============================================================================ */
const STUD=0.088, PLATE=0.088, SHEET=0.0125, STEP=0.61;
const F2 = 3.35, DECK_T = 0.22;           // отметка низа настила 2 этажа и его толщина
const H1 = F2 - 0.0, H2 = 3.05;
const WALLSEGS = [];                       // для размещения декора
let GRAF_COUNT = 0, POSTER_COUNT = 0;
const DECORSPOTS = [];

function buildWall(x1,z1,x2,z2, y0,h, opt={}){
  const dx=x2-x1, dz=z2-z1, len=Math.hypot(dx,dz);
  if(len < 0.05) return;
  const ang = Math.atan2(dx,dz);
  const ux=dx/len, uz=dz/len, nx=uz, nz=-ux;
  const th = opt.th ?? 0.14;
  const sheath = opt.sheath ?? 'both';
  const ops = (opt.openings||[]).slice().sort((a,b)=>a.at-b.at);
  for(const o of ops) o.y1 = Math.min(o.y1, h);
  const P = (t,n,y) => [x1+ux*t+nx*n, y, z1+uz*t+nz*n];
  const put = (t0,t1,yc,sy,mat,nOff,tk,d)=>{
    const L=t1-t0; if(L<=0.012) return;
    const [cx,cy,cz]=P(t0+L/2,nOff,yc);
    const g=new THREE.BoxGeometry(tk,sy,L); uvBox(g,tk,sy,L,d??0.5, mat==='wood');
    _e.set(0,ang,0); _q.setFromEuler(_e);
    _m4.compose(new THREE.Vector3(cx,cy,cz),_q,new THREE.Vector3(1,1,1));
    g.applyMatrix4(_m4); bucket(mat).push(g);
  };
  put(0,len,y0+PLATE/2,PLATE,'wood',0,th,.8);
  put(0,len,y0+h-PLATE/2,PLATE,'wood',0,th,.8);
  if(h>2.6) put(0,len,y0+h*0.52,0.07,'wood',0,th*0.9,.8);

  const inOp = t => ops.some(o=> t>o.at-0.1 && t<o.at+o.w+0.1 && o.y0<1.2);
  for(let t=0;t<=len+0.001;t+=STEP){
    const tt=Math.min(t,len-STUD/2);
    if(inOp(tt)) continue;
    put(tt-STUD/2,tt+STUD/2,y0+h/2,h-PLATE*2,'wood',0,th,.85);
  }
  for(const o of ops){
    put(o.at-STUD,o.at,y0+h/2,h-PLATE*2,'wood',0,th,.85);
    put(o.at+o.w,o.at+o.w+STUD,y0+h/2,h-PLATE*2,'wood',0,th,.85);
    if(o.y1 < h-0.14) put(o.at-STUD,o.at+o.w+STUD,y0+o.y1+0.07,0.14,'wood',0,th,.85);
    if(o.y0 > 0.05)   put(o.at-STUD,o.at+o.w+STUD,y0+o.y0-0.05,0.09,'wood',0,th,.85);
  }
  // обшивка вокруг проёмов
  const rects=[]; let cur=0;
  for(const o of ops){
    if(o.at-cur>0.02) rects.push([cur,o.at,0,h]);
    if(o.y0>0.02) rects.push([o.at,o.at+o.w,0,o.y0]);
    if(h-o.y1>0.02) rects.push([o.at,o.at+o.w,o.y1,h]);
    cur=o.at+o.w;
  }
  if(len-cur>0.02) rects.push([cur,len,0,h]);

  let sides = sheath==='none' ? [] : (sheath==='one' ? [opt.side??1] : [1,-1]);
  for(const [t0,t1,ry0,ry1] of rects){
    const L=t1-t0, Hh=ry1-ry0, yc=y0+(ry0+ry1)/2;
    for(const s of sides){
      const nOff=s*(th/2+SHEET/2);
      // Обшивка кладётся отдельными листами 1.22 x 2.44 м с технологическим зазором,
      // иначе стена читается как один монолитный блок.
      const SW = 1.22, SH = 2.44, GAP = 0.012;
      const cols = Math.max(1, Math.ceil(L/SW));
      const rows = Math.max(1, Math.ceil(Hh/SH));
      const cw = L/cols, ch = Hh/rows;
      for(let ci=0; ci<cols; ci++) for(let ri=0; ri<rows; ri++){
        if(opt.gaps && srnd() < opt.gaps) continue;       // недостающие листы — недострой
        const lt0 = t0 + ci*cw + GAP/2, ltW = cw - GAP;
        const ly0 = ry0 + ri*ch + GAP/2, lhH = ch - GAP;
        if(ltW < 0.05 || lhH < 0.05) continue;
        const lyc = y0 + ly0 + lhH/2;
        const [cx,cy,cz]=P(lt0+ltW/2,nOff,lyc);
        const g=new THREE.BoxGeometry(SHEET,lhH,ltW); uvBox(g,SHEET,lhH,ltW,0.82);
        _e.set(0,ang,0); _q.setFromEuler(_e);
        _m4.compose(new THREE.Vector3(cx,cy,cz),_q,new THREE.Vector3(1,1,1));
        g.applyMatrix4(_m4);
        // партии ОСП отличаются: одни листы светлее, другие серее и темнее
        const t0c = sr(0.80, 1.06), warmv = sr(0.94, 1.03);
        tintGeo(g, t0c*warmv, t0c*sr(0.97,1.01), t0c*sr(0.90,1.0));
        bucket(srnd()<0.5?'osb':'osb2').push(g);
        if(ltW>1.0 && lhH>1.6) DECORSPOTS.push({x:cx+nx*s*0.02, y:lyc, z:cz+nz*s*0.02,
                                             rotY:Math.atan2(nx*s,nz*s), w:ltW, h:lhH, f:y0>2?2:1});
      }
    }
    const thk=th+SHEET*2;
    const [cx,cy,cz]=P(t0+L/2,0,yc);
    const ex = Math.abs(ux)>0.5 ? L/2 : thk/2, ez = Math.abs(ux)>0.5 ? thk/2 : L/2;
    COLLIDERS.push({x0:cx-ex,y0:cy-Hh/2,z0:cz-ez,x1:cx+ex,y1:cy+Hh/2,z1:cz+ez});
  }
  WALLSEGS.push({x1,z1,x2,z2,y0,h});
}

/** Перекрытие: настил + балки + ОБЯЗАТЕЛЬНЫЕ опоры по периметру (иначе висит в воздухе). */
function deck(x0,z0,x1,z1, y=F2, opt={}){
  const sx=x1-x0, sz=z1-z0, cx=(x0+x1)/2, cz=(z0+z1)/2;
  if(sx<0.05||sz<0.05) return;
  addBox('osb', cx, y+DECK_T/2, cz, sx, DECK_T, sz, {d:.85, tint:[0.88,0.87,0.83]});
  const n = Math.max(2, Math.round(sx/STEP));
  for(let i=0;i<=n;i++){
    addBox('wood', x0+i*sx/n, y-0.14, cz, 0.075, 0.28, sz, {collide:false, d:.9});
  }
  for(const zz of [z0+0.07, z1-0.07])
    addBox('wood', cx, y-0.14, zz, sx, 0.28, 0.14, {collide:false, d:.9});
  for(const xx of [x0+0.07, x1-0.07])
    addBox('wood', xx, y-0.14, cz, 0.14, 0.28, sz, {collide:false, d:.9});
  // опорные стойки под углами и вдоль длинных сторон
  if(opt.posts !== false){
    const px = [], pz = [];
    const stepP = 3.6;
    for(let t=0;t<=sx+0.01;t+=Math.min(stepP, sx)) px.push(clamp(x0+t, x0+0.14, x1-0.14));
    for(let t=0;t<=sz+0.01;t+=Math.min(stepP, sz)) pz.push(clamp(z0+t, z0+0.14, z1-0.14));
    const seen = new Set();
    for(const X of px) for(const Z of pz){
      const edge = Math.abs(X-x0)<0.2 || Math.abs(X-x1)<0.2 || Math.abs(Z-z0)<0.2 || Math.abs(Z-z1)<0.2;
      if(!edge && !(opt.innerPosts)) continue;
      const k = X.toFixed(1)+'|'+Z.toFixed(1);
      if(seen.has(k)) continue; seen.add(k);
      addBox('wood', X, (y-0.28)/2, Z, 0.12, y-0.28, 0.12, {d:1.0});
    }
  }
}
/** Настил с вырезами (лестничные проёмы, атриум). */
function deckHoles(x0,z0,x1,z1, holes, y=F2, opt={}){
  let rects=[[x0,z0,x1,z1]];
  for(const [hx0,hz0,hx1,hz1] of holes){
    const next=[];
    for(const [ax0,az0,ax1,az1] of rects){
      const ox0=Math.max(ax0,hx0), oz0=Math.max(az0,hz0);
      const ox1=Math.min(ax1,hx1), oz1=Math.min(az1,hz1);
      if(ox0>=ox1||oz0>=oz1){ next.push([ax0,az0,ax1,az1]); continue; }
      if(az0<oz0) next.push([ax0,az0,ax1,oz0]);
      if(oz1<az1) next.push([ax0,oz1,ax1,az1]);
      if(ax0<ox0) next.push([ax0,oz0,ox0,oz1]);
      if(ox1<ax1) next.push([ox1,oz0,ax1,oz1]);
    }
    rects=next;
  }
  for(const [a,b,c,d] of rects) deck(a,b,c,d,y,opt);
}
function railing(x1,z1,x2,z2, y=F2+DECK_T, h=1.04, opt={}){
  const len=Math.hypot(x2-x1,z2-z1); if(len<0.1) return;
  const ux=(x2-x1)/len, uz=(z2-z1)/len, ang=Math.atan2(x2-x1,z2-z1);
  const n=Math.max(1,Math.round(len/1.35));
  for(let i=0;i<=n;i++){
    const t=i*len/n;
    addBox('wood', x1+ux*t, y+h/2, z1+uz*t, 0.09,h,0.09, {collide:false, d:.95});
  }
  for(const yy of [y+h-0.045, y+h*0.52]){
    const g=new THREE.BoxGeometry(0.065,0.09,len); uvBox(g,0.065,0.09,len,.95,true);
    _e.set(0,ang,0); _q.setFromEuler(_e);
    _m4.compose(new THREE.Vector3((x1+x2)/2,yy,(z1+z2)/2),_q,new THREE.Vector3(1,1,1));
    g.applyMatrix4(_m4); bucket('wood').push(g);
  }
  if(opt.solid !== false){
    const cx=(x1+x2)/2, cz=(z1+z2)/2;
    const ex=Math.abs(ux)>0.5?len/2:0.11, ez=Math.abs(ux)>0.5?0.11:len/2;
    COLLIDERS.push({x0:cx-ex,y0:y,z0:cz-ez,x1:cx+ex,y1:y+h,z1:cz+ez});
  }
}
function stairs(x0,z0, dir, y0,y1, width=1.5, run=5.4){
  const steps=Math.max(10, Math.round((y1-y0)/0.185));
  const rise=(y1-y0)/steps, tread=run/steps;
  const long = dir==='+x'||dir==='-x';
  for(let i=0;i<steps;i++){
    const t=tread*(i+0.5);
    let cx=x0, cz=z0, sx=width, sz=tread;
    if(dir==='+z') cz=z0+t; else if(dir==='-z') cz=z0-t;
    else if(dir==='+x'){ cx=x0+t; sx=tread; sz=width; }
    else { cx=x0-t; sx=tread; sz=width; }
    addBox('wood', cx, y0+rise*(i+1)-0.045, cz, sx, 0.09, sz, {d:1.1});
    addBox('osb2', cx + (dir==='+x'?-tread/2:dir==='-x'?tread/2:0), y0+rise*(i+0.5),
           cz + (dir==='+z'?-tread/2:dir==='-z'?tread/2:0),
           long?0.035:sx, rise, long?sz:0.035, {collide:false, d:.5});
  }
  for(const s of [-1,1]){
    const cx = long ? x0+(dir==='+x'?run/2:-run/2) : x0+s*width/2;
    const cz = long ? z0+s*width/2 : z0+(dir==='+z'?run/2:-run/2);
    addBox('wood', cx, (y0+y1)/2-0.24, cz, long?run:0.1, 0.36, long?0.1:run, {collide:false, d:1.1});
    // стойки перил вдоль марша
    for(let i=0;i<=3;i++){
      const t = i*run/3;
      const px = long ? x0+(dir==='+x'?t:-t) : x0+s*width/2;
      const pz = long ? z0+s*width/2 : z0+(dir==='+z'?t:-t);
      const yy = y0 + (y1-y0)*(t/run);
      addBox('wood', px, yy+0.5, pz, 0.08, 1.0, 0.08, {collide:false, d:1});
    }
  }
}

/* ============================================================================
   ПЛАНИРОВКА ЗДАНИЯ
   Anfilada: часть дверей выстроена в одну ось — длинные простреливаемые линии.
============================================================================ */
const BX0=-20, BX1=20, BZ0=-12.5, BZ1=12.5;
const ATR = {x0:5.5, z0:-4.5, x1:14.5, z1:4.5};     // атриум на два света

function buildShootHouse(){
  const D  = (at,w=1.02)=>({at,w,y0:0,y1:2.10});     // дверь
  const Wn = (at,w=1.15)=>({at,w,y0:0.92,y1:1.92});  // окно
  const Wl = (at,w=1.8) =>({at,w,y0:0.70,y1:2.00});  // широкий проём

/* ============================================================================
   СВЕТ
   Солнце — одно, с высоким разрешением тени; проёмы в кровле сами дают
   световые пятна на полу, потому что кровля отбрасывает тень.
============================================================================ */
let sun, hemi, ambient, NIGHT=false;
const FILLS=[], LIGHT_POOL=[], SHAFTS=[];
let sunTarget;

function buildLights(){
  hemi = new THREE.HemisphereLight(0xaebfd0, 0x8a7e6c, 0.68); scene.add(hemi);
  ambient = new THREE.AmbientLight(0xdfe3e6, 0.16); scene.add(ambient);

  sun = new THREE.DirectionalLight(0xfff2dc, 5.4);
  sun.position.set(-34, 40, 22);
  sunTarget = new THREE.Object3D(); sunTarget.position.set(2,0,-4); scene.add(sunTarget);
  sun.target = sunTarget;
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096,4096);
  const c = sun.shadow.camera;
  c.left=-40; c.right=40; c.top=34; c.bottom=-34; c.near=1; c.far=120;
  sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.028;
  scene.add(sun);

  // мягкие заполняющие от остекления (без теней — дёшево)
  const f1 = new THREE.DirectionalLight(0xc6d4e6, 0.5); f1.position.set(30,14,-26); scene.add(f1);
  const f2 = new THREE.DirectionalLight(0xbcc8d8, 0.34); f2.position.set(-30,13,26); scene.add(f2);
  const f3 = new THREE.DirectionalLight(0xe8e2d4, 0.28); f3.position.set(6,24,2);   scene.add(f3);
  // отражённый от бетонного пола свет — иначе низ кровли и фермы уходят в смолу
  const bounce = new THREE.DirectionalLight(0xd4cbba, 0.55);
  bounce.position.set(0,-20,0); scene.add(bounce);
  FILLS.push(f1,f2,f3,bounce);

  for(let i=0;i<6;i++){
    const L = new THREE.PointLight(0xe6e4dc, 0, 16, 2);
    L.position.set(0,-60,0); scene.add(L); LIGHT_POOL.push(L);
  }
}

/* --- Объёмные световые столбы из проёмов кровли (аддитивные конусы) --- */
const shaftMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide,
  uniforms:{ uColor:{value:new THREE.Color(0xffe8c4)}, uOpacity:{value:0.055}, uTime:{value:0} },
  vertexShader:`
    varying vec3 vPos; varying vec2 vUv;
    void main(){ vUv=uv; vPos=position;
      gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    uniform vec3 uColor; uniform float uOpacity, uTime;
    varying vec3 vPos; varying vec2 vUv;
    void main(){
      // затухание к низу столба и к его краям
      float h = clamp(vUv.y, 0.0, 1.0);
      float fade = pow(1.0 - h, 2.1);
      // мягкие края: иначе конус читается как непрозрачная белая стена
      float edge = smoothstep(0.0, 0.46, vUv.x) * smoothstep(1.0, 0.54, vUv.x);
      edge = pow(edge, 1.6);
      float flick = 0.94 + 0.06*sin(uTime*0.6 + vPos.x*0.5);
      gl_FragColor = vec4(uColor, uOpacity*fade*edge*flick);
    }`
});
function buildShafts(){
  const dir = new THREE.Vector3().subVectors(sunTarget.position, sun.position).normalize();
  for(const h of SUNHOLES){
    if(!h.open) continue;
    const len = (h.y - 0.0) / Math.max(0.2, -dir.y);   // до пола
    const end = new THREE.Vector3(h.x,h.y,h.z).addScaledVector(dir, len);
    // столб как вытянутая коробка вдоль направления солнца
    const g = new THREE.CylinderGeometry(Math.max(h.w,h.d)*0.55, Math.max(h.w,h.d)*0.78, len, 14, 1, true);
    const m = new THREE.Mesh(g, shaftMat);
    m.position.set((h.x+end.x)/2, (h.y+end.y)/2, (h.z+end.z)/2);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,-1,0), dir);
    m.renderOrder = 3; m.frustumCulled = true;
    scene.add(m); SHAFTS.push(m);
    // яркое пятно на полу
    const spot = new THREE.Mesh(new THREE.CircleGeometry(Math.max(h.w,h.d)*0.62, 20),
      new THREE.MeshBasicMaterial({color:0xffeccd, transparent:true, opacity:0.055,
        blending:THREE.AdditiveBlending, depthWrite:false}));
    spot.rotation.x = -Math.PI/2; spot.position.set(end.x, 0.012, end.z);
    scene.add(spot); SHAFTS.push(spot);
  }
  // лучи из ленточного остекления — широкие плоские «пластины» света
  for(const w of WINDOWS){
    if(srnd() > 0.34) continue;
    const len = 13;
    const g = new THREE.PlaneGeometry(w.w*1.1, len);
    const m = new THREE.Mesh(g, shaftMat.clone());
    m.material.uniforms.uOpacity.value = 0.022;
    const d = new THREE.Vector3().subVectors(sunTarget.position, sun.position).normalize();
    const end = w.pos.clone().addScaledVector(d, len*0.5);
    m.position.copy(end);
    m.lookAt(w.pos.clone().add(new THREE.Vector3(0,0,0)));
    m.rotateX(Math.PI/2);
    m.renderOrder = 3;
    scene.add(m); SHAFTS.push(m);
  }
}
/* --- Пыль в воздухе: точки, подсвеченные в лучах --- */
let dust;
function buildDust(){
  const N = 5200;
  const pos = new Float32Array(N*3), rndv = new Float32Array(N);
  for(let i=0;i<N;i++){
    pos[i*3]   = sr(-HW+1, HW-1);
    pos[i*3+1] = sr(0.2, EAVE-0.5);
    pos[i*3+2] = sr(-HD+1, HD-1);
    rndv[i] = srnd();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('aRnd', new THREE.BufferAttribute(rndv,1));
  const m = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{ uTime:{value:0}, uSize:{value:1.15}, uOpacity:{value:0.5},
               uPixelRatio:{value:renderer.getPixelRatio()} },
    vertexShader:`
      attribute float aRnd; uniform float uTime,uSize,uPixelRatio;
      varying float vA;
      void main(){
        vec3 p = position;
        // медленный дрейф по воздуху
        p.x += sin(uTime*0.10 + aRnd*31.4)*0.55;
        p.y += sin(uTime*0.07 + aRnd*17.7)*0.35;
        p.z += cos(uTime*0.09 + aRnd*23.1)*0.55;
        vec4 mv = modelViewMatrix*vec4(p,1.0);
        gl_Position = projectionMatrix*mv;
        gl_PointSize = clamp(uSize*uPixelRatio*(9.0/max(-mv.z,1.0)), 0.6, 3.2);
        // ближе к свету сверху — ярче
        vA = (0.30 + 0.70*aRnd) * smoothstep(0.0,3.0,p.y);
      }`,
    fragmentShader:`
      uniform float uOpacity; varying float vA;
      void main(){
        vec2 d = gl_PointCoord - 0.5;
        float a = smoothstep(0.5, 0.06, length(d));
        gl_FragColor = vec4(vec3(1.0,0.95,0.86), a*vA*uOpacity);
      }`
  });
  dust = new THREE.Points(g, m);
  dust.frustumCulled = false;
  scene.add(dust);
}
function updateLightPool(pos){
  if(!LAMPS.length) return;
  LAMPS.forEach(l => l.d = (l.pos.x-pos.x)**2 + (l.pos.z-pos.z)**2);
  const near = LAMPS.filter(l=>l.on).sort((a,b)=>a.d-b.d).slice(0, LIGHT_POOL.length);
  const power = NIGHT ? 7.0 : 2.6;
  near.forEach((l,i)=>{
    const L = LIGHT_POOL[i];
    L.position.copy(l.pos);
    L.intensity = power * clamp(1 - Math.sqrt(l.d)/24, 0, 1);
  });
  for(let i=near.length;i<LIGHT_POOL.length;i++) LIGHT_POOL[i].intensity = 0;
}
function setNight(on){
  NIGHT = on;
  sun.intensity = on ? 0.06 : 4.6;
  hemi.intensity = on ? 0.12 : 0.68;
  ambient.intensity = on ? 0.05 : 0.20;
  FILLS.forEach((f,i)=> f.intensity = on ? 0.03 : [0.5,0.34,0.28,0.55][i]);
  for(const s of SHAFTS) s.visible = !on;
  if(dust) dust.material.uniforms.uOpacity.value = on ? 0.10 : 0.42;
  scene.fog.color.set(on ? 0x05070c : 0x9aa0a6);
  if(SKY) SKY.material.color.set(on ? 0x0c1220 : 0xffffff);
  scene.fog.density = on ? 0.014 : 0.0048;
  scene.background = new THREE.Color(on ? 0x04050a : 0x14151a);
  M.glass.color.set(on ? 0x2b3a52 : 0xc4cfd6);
  scene.environmentIntensity = on ? 0.12 : 1.0;
  renderer.toneMappingExposure = on ? 1.30 : 1.02;
}

/* ============================================================================
   РЕКВИЗИТ И УКРЫТИЯ
============================================================================ */
const PROPS = new THREE.Group(); 
/** Зоны, которые реквизит занимать не должен: марши и проёмы лестниц. */
const NOPROP = [
  {x0:-19.2, z0:-11.6, x1:-16.2, z1:-4.0},   // левая лестница + проём
  {x0: 15.0, z0:-12.0, x1: 18.4, z1:-4.2}    // правая лестница + проём
];
function inNoProp(x,z){
  return NOPROP.some(n => x > n.x0 && x < n.x1 && z > n.z0 && z < n.z1);
}
/** Возвращает отметку реальной опоры под точкой. Без этого пропы на уровне
    2 этажа повисают в воздухе там, где настила нет (атриум, лестничные проёмы). */
function snapSupport(x, z, yWanted){
  if(inNoProp(x,z)) return null;              // сюда ничего не ставим
  let best = null;
  for(const c of COLLIDERS){
    if(x <= c.x0 || x >= c.x1 || z <= c.z0 || z >= c.z1) continue;
    if(c.y1 > yWanted + 0.45) continue;                 // выше искомой отметки — не опора
    if(best === null || c.y1 > best) best = c.y1;
  }
  if(best === null) return 0;                           // нет опоры → на бетон
  return Math.abs(best - yWanted) < 0.45 ? yWanted : best;
}
function meshAt(geo, mat, x,y,z, opt={}){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x,y,z);
  if(opt.rotY) m.rotation.y = opt.rotY;
  if(opt.rotX) m.rotation.x = opt.rotX;
  if(opt.rotZ) m.rotation.z = opt.rotZ;
  m.castShadow = opt.cast !== false; m.receiveShadow = true;
  scene.add(m); SHOOTABLE.push(m);
  return m;
}
/* --- бочка 200 л с рёбрами --- */
const barrelGeoCache = {};
function barrel(x,y,z,col,tipped){
  y = snapSupport(x,z,y); if(y === null) return;
  const key = 'b'; 
  if(!barrelGeoCache[key]){
    const parts = [];
    const body = new THREE.CylinderGeometry(0.295,0.295,0.88,20,1);
    parts.push(body);
    for(const yy of [-0.22,0.0,0.22]){
      const r = new THREE.TorusGeometry(0.30,0.022,6,20); r.rotateX(Math.PI/2); r.translate(0,yy,0);
      parts.push(r);
    }
    const lid = new THREE.CylinderGeometry(0.30,0.30,0.035,20); lid.translate(0,0.45,0);
    parts.push(lid);
    barrelGeoCache[key] = BGU.mergeGeometries(parts,false);
  }
  const mat = col==='green' ? M.paintG : col==='blue' ? M.plastB : col==='orange' ? M.plastO : M.steel;
  const m = meshAt(barrelGeoCache[key], mat, x, y+(tipped?0.30:0.44), z, {rotY:sr(0,6.28)});
  if(tipped){ m.rotation.z = Math.PI/2; m.rotation.y = sr(0,6.28);
    COLLIDERS.push({x0:x-0.46,y0:y,z0:z-0.46,x1:x+0.46,y1:y+0.6,z1:z+0.46}); }
  else COLLIDERS.push({x0:x-0.31,y0:y,z0:z-0.31,x1:x+0.31,y1:y+0.9,z1:z+0.31});
  return m;
}
/* --- покрышка --- */
let tireGeo;
function tire(x,y,z,stand){

/* ---------- Строительные леса: главный вертикальный объект недостроя ---------- */
function scaffold(x,y,z,rotY,bays=2,levels=2){
  y = snapSupport(x,z,y); if(y === null) return;
  const BW=1.9, BD=1.15, LH=1.95;
  for(let b=0;b<=bays;b++){
    for(const sd of [-1,1]){
      const ox = -bays*BW/2 + b*BW, oz = sd*BD/2;
      const px = x + Math.cos(rotY)*ox - Math.sin(rotY)*oz;
      const pz = z - Math.sin(rotY)*ox - Math.cos(rotY)*oz;
      addBox('steel', px, y+levels*LH/2, pz, 0.055, levels*LH, 0.055, {collide:false, d:1.2});
    }
  }
  for(let l=1;l<=levels;l++){
    const ly = y + l*LH;
    // ригели вдоль и поперёк
    addBox('steel', x, ly, z, bays*BW, 0.05, 0.05, {rotY, collide:false, d:1.2});
    for(const sd of [-1,1]){
      const oz = sd*BD/2;
      addBox('steel', x - Math.sin(rotY)*oz, ly-0.02, z - Math.cos(rotY)*oz,
             bays*BW, 0.05, 0.05, {rotY, collide:false, d:1.2});
    }
    // настил из досок
    for(let d=0;d<4;d++){
      const oz = -BD/2 + 0.16 + d*0.28;
      addBox('wood', x - Math.sin(rotY)*oz, ly+0.06, z - Math.cos(rotY)*oz,
             bays*BW-0.1, 0.035, 0.26, {rotY, collide:false, d:1.1});
    }
    addAABB(x, ly+0.05, z, bays*BW, 0.12, BD, rotY);
    // диагональные раскосы
    for(let b=0;b<bays;b++){
      const ox = -bays*BW/2 + b*BW + BW/2;
      const len = Math.hypot(BW, LH);
      const g = new THREE.BoxGeometry(len, 0.04, 0.04);
      g.rotateZ(Math.atan2(LH, BW) * (b%2?1:-1));
      _e.set(0,rotY,0); _q.setFromEuler(_e);
      const px = x + Math.cos(rotY)*ox, pz = z - Math.sin(rotY)*ox;
      _m4.compose(new THREE.Vector3(px, ly-LH/2, pz + (rotY?0:BD/2)), _q, new THREE.Vector3(1,1,1));
      g.applyMatrix4(_m4); bucket('steel').push(g);
    }
  }
}

function hangingTarp(x,y,z,rotY,w=2.2,h=2.6){
  const seg = 10;

  const pos = g.attributes.position;
  for(let i=0;i<pos.count;i++){
    const u = (pos.getX(i)/w + 0.5), v = (pos.getY(i)/h + 0.5);
    // провис и складки: сверху закреплено, снизу свободно
    pos.setZ(i, Math.sin(u*Math.PI*3.2)*0.10*(1-v) + Math.sin(v*4.0)*0.04);
    pos.setX(i, pos.getX(i)*(1 - 0.06*(1-v)));
  }
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    color:0xbcc2c0, roughness:.82, metalness:0, side:THREE.DoubleSide,
    transparent:true, opacity:.55 }));
  m.position.set(x,y,z); m.rotation.y = rotY;
  m.castShadow = true; scene.add(m);
}

function bricks(x,y,z,rotY,rows=5){
  y = snapSupport(x,z,y); if(y === null) return;
  pallet(x,y,z,rotY,1);
  const bm = new THREE.MeshStandardMaterial({color:0x8a5f4a, roughness:.92});
  const parts=[];
  for(let r=0;r<rows;r++) for(let i=0;i<5;i++) for(let j=0;j<3;j++){
    const g = new THREE.BoxGeometry(0.22,0.065,0.105);
    const off = r%2 ? 0.11 : 0;
    g.translate(-0.44+i*0.23+off, 0.17+r*0.07, -0.22+j*0.22);
    parts.push(g);
  }
  const m = new THREE.Mesh(BGU.mergeGeometries(parts,false), bm);
  m.position.set(x,y,z); m.rotation.y=rotY;
  m.castShadow=true; m.receiveShadow=true; scene.add(m); SHOOTABLE.push(m);
  addAABB(x, y+0.3, z, 1.2, 0.55, 0.8, rotY);
}
/* ---------- Оконная рама, прислонённая к стене ---------- */
function windowFrame(x,y,z,rotY,tilt=0.18){
  y = snapSupport(x,z,y); if(y === null) return;
  const g = new THREE.Group();
  const W=1.0,H=1.35;
  for(const [sx,sy,w,h] of [[0,H/2,W,0.06],[0,-H/2,W,0.06],[-W/2,0,0.06,H],[W/2,0,0.06,H],[0,0,W,0.05]]){
    const b = new THREE.Mesh(new THREE.BoxGeometry(w,h,0.055), M.wood);
    b.position.set(sx,sy,0); g.add(b);
  }
  const gl = new THREE.Mesh(new THREE.PlaneGeometry(W-0.1,H-0.1), M.glass);
  gl.position.z = 0.01; g.add(gl);
  g.position.set(x, y+H/2*Math.cos(tilt), z);
  g.rotation.set(0, rotY, 0); g.rotateX(tilt);
  g.traverse(o=>{ o.castShadow=true; o.receiveShadow=true; });
  scene.add(g);
  COLLIDERS.push({x0:x-0.6,y0:y,z0:z-0.6,x1:x+0.6,y1:y+1.3,z1:z+0.6});
}

function buildDecals(){
  const grafMats = [];
  for(let i=0;i<8;i++) grafMats.push(new THREE.MeshStandardMaterial({
    map: graffitiTex(i), transparent:true, depthWrite:false, opacity:0.62,
    roughness:0.95, metalness:0, side:THREE.FrontSide,
    polygonOffset:true, polygonOffsetFactor:-4, polygonOffsetUnits:-4
  }));
  const posterMats = [];
  for(let i=0;i<3;i++) posterMats.push(new THREE.MeshStandardMaterial({
    map: posterTex(i), transparent:true, depthWrite:false, opacity:0.85,
    roughness:0.92, metalness:0,
    polygonOffset:true, polygonOffsetFactor:-4, polygonOffsetUnits:-4
  }));

  // Крупные росписи кладём на стену целиком, а не на отдельный лист обшивки:
  // лист всего 1.22 м, и по нему мурал не разместить.
  const longWalls = WALLSEGS.filter(w => Math.hypot(w.x2-w.x1, w.z2-w.z1) > 3.2);
  const used = [];
  let placed = 0;
  for(let guard=0; guard<900 && placed<26; guard++){
    const w = longWalls[Math.floor(srnd()*longWalls.length)];
    if(!w) break;
    const len = Math.hypot(w.x2-w.x1, w.z2-w.z1);
    const ux = (w.x2-w.x1)/len, uz = (w.z2-w.z1)/len;
    const nx = uz, nz = -ux;
    const side = srnd() < 0.5 ? 1 : -1;
    const size = Math.min(sr(1.9, 3.1), w.h*0.78, len*0.42);
    if(size < 1.2) continue;
    const t = sr(size*0.62, len - size*0.62);
    const px = w.x1 + ux*t + nx*side*0.086;
    const pz = w.z1 + uz*t + nz*side*0.086;
    if(used.some(u => Math.hypot(u.x-px, u.z-pz) < 2.6)) continue;
    const py = w.y0 + clamp(sr(1.05, 1.75), size/2 + 0.12, w.h - size/2 - 0.1);
    if(py - size/2 < w.y0 + 0.05) continue;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size), spick(grafMats));
    m.position.set(px, py, pz);
    m.rotation.y = Math.atan2(nx*side, nz*side);
    m.renderOrder = 2;
    scene.add(m); used.push({x:px, z:pz}); placed++;
  }
  GRAF_COUNT = placed;
  // плакаты и наклейки — у проёмов, на уровне глаз
  let pp = 0;
  for(let guard=0; guard<700 && pp<16; guard++){
    const w = WALLSEGS[Math.floor(srnd()*WALLSEGS.length)];
    if(!w) break;
    const len = Math.hypot(w.x2-w.x1, w.z2-w.z1);
    if(len < 1.6) continue;
    const ux=(w.x2-w.x1)/len, uz=(w.z2-w.z1)/len, nx=uz, nz=-ux;
    const side = srnd()<0.5?1:-1;
    const t = sr(0.5, len-0.5);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(0.44, 0.62), spick(posterMats));
    m.position.set(w.x1+ux*t+nx*side*0.086, w.y0 + sr(1.35,1.8), w.z1+uz*t+nz*side*0.086);
    m.rotation.y = Math.atan2(nx*side, nz*side);
    m.rotation.z = sr(-0.05,0.05); m.renderOrder = 2;
    scene.add(m); pp++;
  }
  POSTER_COUNT = pp;
  // пятна на полу обоих этажей
  const stainMats = [];
  for(let i=0;i<4;i++) stainMats.push(new THREE.MeshStandardMaterial({
    map: stainTex(), transparent:true, depthWrite:false, opacity:0.6,
    roughness:0.9, metalness:0,
    polygonOffset:true, polygonOffsetFactor:-3, polygonOffsetUnits:-3
  }));
  for(let i=0;i<46;i++){
    const m = new THREE.Mesh(new THREE.PlaneGeometry(sr(1.2,3.4), sr(1.2,3.4)), spick(stainMats));
    m.rotation.x = -Math.PI/2; m.rotation.z = sr(0,6.28);
    const onDeck = srnd() < 0.3;
    m.position.set(sr(-24,24), onDeck ? F2+DECK_T+0.012 : 0.011, sr(-17,17));
    if(onDeck && (Math.abs(m.position.x)>19 || Math.abs(m.position.z)>12)) m.position.y = 0.011;
    m.renderOrder = 1;
    scene.add(m);
  }
  // строительный мусор: щепки, обрезки, гвозди
  const debris = [];
  for(let i=0;i<300;i++){
    const g = new THREE.BoxGeometry(sr(0.05,0.5), sr(0.012,0.05), sr(0.03,0.16));
    const onDeck = srnd()<0.28;
    const y = onDeck ? F2+DECK_T+0.02 : 0.02;
    const x = sr(-25,25), z = sr(-18,18);
    if(onDeck && (Math.abs(x)>19.5 || Math.abs(z)>12)) continue;
    _e.set(0, sr(0,6.28), sr(-0.08,0.08)); _q.setFromEuler(_e);
    _m4.compose(new THREE.Vector3(x,y,z), _q, new THREE.Vector3(1,1,1));
    g.applyMatrix4(_m4); debris.push(g);
  }
  const dm = new THREE.Mesh(BGU.mergeGeometries(debris,false), M.wood);
  dm.castShadow = true; dm.receiveShadow = true; scene.add(dm);
}
