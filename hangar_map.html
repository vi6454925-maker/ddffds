  barrel(-7.5,Y2,5.2,'blue'); pallet(-3.0, Y2, 5.4, 0.3, 3);
  lumberPile(-14.5, Y2, 10.0, 0.02, 3.0, 4);
  crate(-8.0,Y2,10.2, 0.2); spool(-3.5, Y2, 10.0);
  // галереи атриума
  cone(6.4,Y2,-2.0); cone(13.6,Y2,2.4);
  barrel(6.6,Y2,2.6,'green'); crate(13.4,Y2,-3.0, 0.3, 0.6);
  bags(17.0, Y2, -6.0, 3); pallet(17.5, Y2, 2.0, 0.15, 2);
  osbStack(12.5, Y2, 9.6, 0.1, 4); tire(8.0,Y2,10.2); tire(8.6,Y2,9.8);
  crate(17.8,Y2,9.4, 0.25); barrel(7.2,Y2,-9.6);
  ladder(11.0, Y2, -10.0, 0.2, 2.2);
  sawhorse(15.0, Y2, -9.6, 0.1);
}

/* --- Декали: граффити, плакаты, пятна --- */
function buildDecals(){
  const grafMats = [];
  for(let i=0;i<8;i++) grafMats.push(new THREE.MeshBasicMaterial({
    map: graffitiTex(i), transparent:true, depthWrite:false, opacity:0.88,
    polygonOffset:true, polygonOffsetFactor:-4, polygonOffsetUnits:-4
  }));
  const posterMats = [];
  for(let i=0;i<3;i++) posterMats.push(new THREE.MeshBasicMaterial({
    map: posterTex(i), transparent:true, depthWrite:false, opacity:0.92,
    polygonOffset:true, polygonOffsetFactor:-4, polygonOffsetUnits:-4
  }));

  // Крупные росписи кладём на стену целиком, а не на отдельный лист обшивки:
  // лист всего 1.22 м, и по нему мурал не разместить.
  const longWalls = WALLSEGS.filter(w => Math.hypot(w.x2-w.x1, w.z2-w.z1) > 3.2);
  const used = [];
  let placed = 0;
  for(let guard=0; guard<900 && placed<26; guard++){
    const w = longWalls[Math.floor(srnd()*longWalls.length)];
    if(!w) break;
    const len = Math.hypot(w.x2-w.x1, w.z2-w.z1);
    const ux = (w.x2-w.x1)/len, uz = (w.z2-w.z1)/len;
    const nx = uz, nz = -ux;
    const side = srnd() < 0.5 ? 1 : -1;
    const size = Math.min(sr(1.9, 3.1), w.h*0.78, len*0.42);
    if(size < 1.2) continue;
    const t = sr(size*0.62, len - size*0.62);
    const px = w.x1 + ux*t + nx*side*0.086;
    const pz = w.z1 + uz*t + nz*side*0.086;
    if(used.some(u => Math.hypot(u.x-px, u.z-pz) < 2.6)) continue;
    const py = w.y0 + clamp(sr(1.05, 1.75), size/2 + 0.12, w.h - size/2 - 0.1);
    if(py - size/2 < w.y0 + 0.05) continue;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size), spick(grafMats));
    m.position.set(px, py, pz);
    m.rotation.y = Math.atan2(nx*side, nz*side);
    m.renderOrder = 2;
    scene.add(m); used.push({x:px, z:pz}); placed++;
  }
  GRAF_COUNT = placed;
  // плакаты и наклейки — у проёмов, на уровне глаз
  let pp = 0;
  for(let guard=0; guard<700 && pp<16; guard++){
    const w = WALLSEGS[Math.floor(srnd()*WALLSEGS.length)];
    if(!w) break;
    const len = Math.hypot(w.x2-w.x1, w.z2-w.z1);
    if(len < 1.6) continue;
    const ux=(w.x2-w.x1)/len, uz=(w.z2-w.z1)/len, nx=uz, nz=-ux;
    const side = srnd()<0.5?1:-1;
    const t = sr(0.5, len-0.5);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(0.44, 0.62), spick(posterMats));
    m.position.set(w.x1+ux*t+nx*side*0.086, w.y0 + sr(1.35,1.8), w.z1+uz*t+nz*side*0.086);
    m.rotation.y = Math.atan2(nx*side, nz*side);
    m.rotation.z = sr(-0.05,0.05); m.renderOrder = 2;
    scene.add(m); pp++;
  }
  POSTER_COUNT = pp;
  // пятна на полу обоих этажей
  const stainMats = [];
  for(let i=0;i<4;i++) stainMats.push(new THREE.MeshBasicMaterial({
    map: stainTex(), transparent:true, depthWrite:false, opacity:0.75,
    polygonOffset:true, polygonOffsetFactor:-3, polygonOffsetUnits:-3
  }));
  for(let i=0;i<46;i++){
    const m = new THREE.Mesh(new THREE.PlaneGeometry(sr(1.2,3.4), sr(1.2,3.4)), spick(stainMats));
    m.rotation.x = -Math.PI/2; m.rotation.z = sr(0,6.28);
    const onDeck = srnd() < 0.3;
    m.position.set(sr(-24,24), onDeck ? F2+DECK_T+0.012 : 0.011, sr(-17,17));
    if(onDeck && (Math.abs(m.position.x)>19 || Math.abs(m.position.z)>12)) m.position.y = 0.011;
    m.renderOrder = 1;
    scene.add(m);
  }
  // строительный мусор: щепки, обрезки, гвозди
  const debris = [];
  for(let i=0;i<300;i++){
    const g = new THREE.BoxGeometry(sr(0.05,0.5), sr(0.012,0.05), sr(0.03,0.16));
    const onDeck = srnd()<0.28;
    const y = onDeck ? F2+DECK_T+0.02 : 0.02;
    const x = sr(-25,25), z = sr(-18,18);
    if(onDeck && (Math.abs(x)>19.5 || Math.abs(z)>12)) continue;
    _e.set(0, sr(0,6.28), sr(-0.08,0.08)); _q.setFromEuler(_e);
    _m4.compose(new THREE.Vector3(x,y,z), _q, new THREE.Vector3(1,1,1));
    g.applyMatrix4(_m4); debris.push(g);
  }
  const dm = new THREE.Mesh(BGU.mergeGeometries(debris,false), M.wood);
  dm.castShadow = true; dm.receiveShadow = true; scene.add(dm);
}

/* ============================================================================
   КАМЕРА-«ТЕНЬ»: свободный полёт, опционально ходьба
============================================================================ */
const PL = {
  pos: new THREE.Vector3(-23, 1.66, -16),
  vel: new THREE.Vector3(),
  yaw: 0.72, pitch: -0.04,
  fly: true, r:0.34, h:1.76, eye:1.62, onGround:false,
  speed: 6.0
};
const keys = Object.create(null);
let SENS = 0.0016, locked = false;

/* --- широкофазная сетка --- */
const GRID = new Map(), CELL = 4;
function gkey(ix,iz){ return ix*10007 + iz; }
function buildGrid(){
  GRID.clear();
  COLLIDERS.forEach((c,i)=>{
    for(let ix=Math.floor(c.x0/CELL); ix<=Math.floor(c.x1/CELL); ix++)
      for(let iz=Math.floor(c.z0/CELL); iz<=Math.floor(c.z1/CELL); iz++){
        const k=gkey(ix,iz); if(!GRID.has(k)) GRID.set(k,[]); GRID.get(k).push(i);
      }
  });
}
const _near=[];
function nearCol(x,z,pad){
  _near.length=0;
  const seen=new Set();
  for(let ix=Math.floor((x-pad)/CELL); ix<=Math.floor((x+pad)/CELL); ix++)
    for(let iz=Math.floor((z-pad)/CELL); iz<=Math.floor((z+pad)/CELL); iz++){
      const arr=GRID.get(gkey(ix,iz)); if(!arr) continue;
      for(const i of arr) if(!seen.has(i)){ seen.add(i); _near.push(COLLIDERS[i]); }
    }
  return _near;
}
const STEP_UP = 0.46;
function overlaps(x,y,z,r,h){
  for(const c of nearCol(x,z,r+0.6)){
    if(x+r<=c.x0||x-r>=c.x1) continue;
    if(z+r<=c.z0||z-r>=c.z1) continue;
    if(y+h<=c.y0||y>=c.y1) continue;
    return c;
  }
  return null;
}
function stepTarget(x,y,z,r,h){
  let top=-1;
  for(const c of nearCol(x,z,r+0.6)){
    if(x+r<=c.x0||x-r>=c.x1) continue;
    if(z+r<=c.z0||z-r>=c.z1) continue;
    if(y+h<=c.y0||y>=c.y1) continue;
    if(c.y1-y > STEP_UP) return -1;
    if(c.y1>top) top=c.y1;
  }
  return top;
}
function moveAxis(axis,d){
  if(Math.abs(d)<1e-6) return;
  const p=PL.pos;
  const stuck = !!overlaps(p.x,p.y,p.z,PL.r,PL.h);
  const nx = axis===0?p.x+d:p.x, nz = axis===2?p.z+d:p.z;
  if(!overlaps(nx,p.y,nz,PL.r,PL.h) || stuck){ if(axis===0) p.x=nx; else p.z=nz; return; }
  const top = stepTarget(nx,p.y,nz,PL.r,PL.h);
  if(top > p.y+0.001 && !overlaps(nx, top+0.03, nz, PL.r, PL.h)){
    p.y = top+0.03; if(axis===0) p.x=nx; else p.z=nz;
    PL.onGround=true; PL.vel.y=Math.max(PL.vel.y,0);
  }
}
function depenetrate(){
  const p=PL.pos;
  for(let i=0;i<3;i++){
    const c = overlaps(p.x,p.y,p.z,PL.r,PL.h);
    if(!c) return;
    const dxMin=(c.x1+PL.r)-p.x, dxMax=p.x-(c.x0-PL.r);
    const dzMin=(c.z1+PL.r)-p.z, dzMax=p.z-(c.z0-PL.r);
    const dyUp=(c.y1+0.02)-p.y;
    const best=Math.min(dxMin,dxMax,dzMin,dzMax, dyUp<=STEP_UP?dyUp:Infinity);
    if(best===dyUp) p.y=c.y1+0.02;
    else if(best===dxMin) p.x=c.x1+PL.r+0.001;
    else if(best===dxMax) p.x=c.x0-PL.r-0.001;
    else if(best===dzMin) p.z=c.z1+PL.r+0.001;
    else p.z=c.z0-PL.r-0.001;
  }
}
function groundH(x,z,yFrom){
  let best=0;
  for(const c of nearCol(x,z,PL.r+0.5)){
    if(x+PL.r<=c.x0||x-PL.r>=c.x1) continue;
    if(z+PL.r<=c.z0||z-PL.r>=c.z1) continue;
    if(c.y1<=yFrom+0.35 && c.y1>best) best=c.y1;
  }
  return best;
}

addEventListener('keydown', e=>{
  keys[e.code]=true;
  if(['Space','KeyW','KeyA','KeyS','KeyD','ControlLeft','Tab'].includes(e.code)) e.preventDefault();
  if(e.code==='KeyG'){ PL.fly=!PL.fly; if(!PL.fly) PL.vel.set(0,0,0); }
  if(e.code==='KeyN') setNight(!NIGHT);
  if(e.code==='F3'){ e.preventDefault(); const f=$('#fps'); f.style.display = f.style.display==='none'?'block':'none'; }
});
addEventListener('keyup', e=>{ keys[e.code]=false; });
addEventListener('mousemove', e=>{
  if(!locked) return;
  PL.yaw -= e.movementX*SENS;
  PL.pitch = clamp(PL.pitch - e.movementY*SENS, -1.52, 1.52);
});
addEventListener('wheel', e=>{ if(locked) PL.speed = clamp(PL.speed * (e.deltaY>0?0.9:1.11), 0.8, 40); }, {passive:true});
renderer.domElement.addEventListener('mousedown', ()=>{ if(!locked) renderer.domElement.requestPointerLock(); });
document.addEventListener('pointerlockchange', ()=>{
  locked = document.pointerLockElement === renderer.domElement;
  $('#gate').classList.toggle('hide', locked);
});
addEventListener('contextmenu', e=>e.preventDefault());

const fwd = new THREE.Vector3(), right = new THREE.Vector3(), tmp = new THREE.Vector3();
function update(dt){
  const boost = (keys['ShiftLeft']||keys['ShiftRight']) ? 3.0 : (keys['AltLeft']||keys['AltRight']) ? 0.28 : 1;
  fwd.set(-Math.sin(PL.yaw),0,-Math.cos(PL.yaw));
  right.set(Math.cos(PL.yaw),0,-Math.sin(PL.yaw));
  let ix=0, iz=0;
  if(keys['KeyW']) iz+=1; if(keys['KeyS']) iz-=1;
  if(keys['KeyD']) ix+=1; if(keys['KeyA']) ix-=1;
  if(ix||iz){ const l=Math.hypot(ix,iz); ix/=l; iz/=l; }

  if(PL.fly){
    const look = new THREE.Vector3(
      -Math.sin(PL.yaw)*Math.cos(PL.pitch), Math.sin(PL.pitch), -Math.cos(PL.yaw)*Math.cos(PL.pitch));
    const sp = PL.speed*boost;
    tmp.set(0,0,0).addScaledVector(look, iz*sp).addScaledVector(right, ix*sp);
    if(keys['Space']) tmp.y += sp;
    if(keys['ControlLeft']||keys['ControlRight']) tmp.y -= sp;
    // плавное ускорение — полёт «как тень», без рывков
    PL.vel.lerp(tmp, Math.min(1, dt*7.5));
    PL.pos.addScaledVector(PL.vel, dt);
    PL.pos.x = clamp(PL.pos.x, -HW-6, HW+6);
    PL.pos.z = clamp(PL.pos.z, -HD-6, HD+6);
    // ниже пола не опускаемся: под бетоном смотреть нечего
    PL.pos.y = clamp(PL.pos.y, 0.25, RIDGE+14);
  } else {
    const sp = 3.6*boost;
    tmp.set(0,0,0).addScaledVector(fwd, iz*sp).addScaledVector(right, ix*sp);
    const acc = PL.onGround ? 13 : 3;
    PL.vel.x += (tmp.x-PL.vel.x)*Math.min(1,acc*dt);
    PL.vel.z += (tmp.z-PL.vel.z)*Math.min(1,acc*dt);
    PL.vel.y -= 19*dt;
    if(keys['Space'] && PL.onGround && !PL.jl){ PL.vel.y=6.0; PL.onGround=false; PL.jl=true; }
    if(!keys['Space']) PL.jl=false;
    moveAxis(0, PL.vel.x*dt); moveAxis(2, PL.vel.z*dt);
    depenetrate();
    PL.pos.y += PL.vel.y*dt;
    const gh = groundH(PL.pos.x, PL.pos.z, PL.pos.y);
    if(PL.vel.y<=0 && PL.pos.y<=gh+0.001){ PL.pos.y=gh; PL.vel.y=0; PL.onGround=true; }
    else {
      PL.onGround=false;
      const up = overlaps(PL.pos.x,PL.pos.y,PL.pos.z,PL.r,PL.h);
      if(up && PL.vel.y>0 && up.y0>PL.pos.y){ PL.pos.y=up.y0-PL.h-0.01; PL.vel.y=0; }
    }
    if(PL.pos.y < -8){ PL.pos.set(-23,1.66,-16); PL.vel.set(0,0,0); }
  }

  camera.position.set(PL.pos.x, PL.pos.y + (PL.fly?0:PL.eye), PL.pos.z);
  camera.rotation.set(0,0,0, 'YXZ');
  camera.rotation.order = 'YXZ';
  camera.rotation.y = PL.yaw; camera.rotation.x = PL.pitch;
  updateLightPool(PL.pos);
}

/* ============================================================================
   ПОСТОБРАБОТКА: чистое кино, без bodycam. Только тонмаппинг-грейд и SMAA.
============================================================================ */
const GradeShader = {
  uniforms:{
    tDiffuse:{value:null}, uVig:{value:0.22}, uSat:{value:1.05},
    uLift:{value:new THREE.Color(0.030,0.030,0.036)}, uGamma:{value:0.96}
  },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader:`
    uniform sampler2D tDiffuse; uniform float uVig,uSat,uGamma; uniform vec3 uLift;
    varying vec2 vUv;
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      // лёгкий подъём теней — «плёночный» чёрный вместо провала в ноль
      c.rgb = c.rgb + uLift*(1.0 - c.rgb);
      float l = dot(c.rgb, vec3(0.2126,0.7152,0.0722));
      c.rgb = mix(vec3(l), c.rgb, uSat);
      c.rgb = pow(max(c.rgb, 0.0), vec3(uGamma));
      // мягкая широкая виньетка (не «объектив», просто спад к краям)
      vec2 d = vUv - 0.5;
      float v = 1.0 - uVig*dot(d,d)*1.9;
      c.rgb *= clamp(v, 0.0, 1.0);
      gl_FragColor = c;
    }`
};
let composer, bloomPass, gradePass, smaaPass;
function buildComposer(){
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.28, 0.85, 0.98);
  composer.addPass(bloomPass);
  gradePass = new ShaderPass(GradeShader);
  composer.addPass(gradePass);
  smaaPass = new SMAAPass(innerWidth*renderer.getPixelRatio(), innerHeight*renderer.getPixelRatio());
  composer.addPass(smaaPass);
  composer.addPass(new OutputPass());
}

/* ============================================================================
   ЦИКЛ
============================================================================ */
const clock = new THREE.Clock();
let fpsAcc=0, fpsN=0, fpsT=0;
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  const t = performance.now()/1000;
  shaftMat.uniforms.uTime.value = t;
  for(const s of SHAFTS) if(s.material.uniforms && s.material.uniforms.uTime) s.material.uniforms.uTime.value = t;
  if(dust) dust.material.uniforms.uTime.value = t;
  composer.render();
  fpsAcc += 1/Math.max(dt,1e-4); fpsN++; fpsT += dt;
  if(fpsT > 0.5){
    const el = $('#fps');
    if(el.style.display !== 'none'){
      el.textContent = `${(fpsAcc/fpsN).toFixed(0)} fps · ${renderer.info.render.calls} calls · `
        + `${(renderer.info.render.triangles/1000).toFixed(0)}k tris · `
        + `${PL.pos.x.toFixed(0)},${PL.pos.y.toFixed(1)},${PL.pos.z.toFixed(0)} · v${PL.speed.toFixed(1)}`;
    }
    fpsAcc=0; fpsN=0; fpsT=0;
  }
}
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  if(smaaPass) smaaPass.setSize(innerWidth*renderer.getPixelRatio(), innerHeight*renderer.getPixelRatio());
});

/* ============================================================================
   СТАРТ
============================================================================ */
function build(){
  scene.fog = new THREE.FogExp2(0x8a8272, 0.0062);
  scene.background = new THREE.Color(0x11100e);
  buildMaterials();
  buildLights();
  buildHangar();
  buildRoof();
  buildLamps();
  buildServices();
  buildShootHouse();
  buildProps();
  flushBuckets();
  buildDecals();
  buildShafts();
  buildDust();
  buildGrid();
  buildComposer();
  setNight(false);

  camera.position.set(PL.pos.x, PL.pos.y, PL.pos.z);
  window.HANGAR_MAP = {
    THREE, scene, camera, renderer, composer,
    colliders: COLLIDERS, raycastTargets: SHOOTABLE, player: PL, keys,
    step: dt => update(dt), setNight,
    bounds:{hw:HW, hd:HD, eave:EAVE, ridge:RIDGE}, floors:{ground:0, deck:F2+DECK_T},
    stats:{graffiti:GRAF_COUNT, posters:POSTER_COUNT, lamps:LAMPS.length, shafts:SHAFTS.length, walls:WALLSEGS.length}
  };
  $('#g_load').style.display = 'none';
  $('#g_ready').style.display = 'block';
  $('#g_go').onclick = ()=> renderer.domElement.requestPointerLock();
  loop();
}
try{ build(); }
catch(err){
  console.error(err);
  $('#g_load').innerHTML = '<p style="color:#d9736b">Ошибка: '+String(err&&err.message||err)+'</p>';
}
</script>
